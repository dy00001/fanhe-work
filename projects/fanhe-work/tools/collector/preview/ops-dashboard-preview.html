function openQuota(st){
  const q = quotaInfo(st, st.a[1]);
  /* 必须读 SER（当前店序列），不能读 DAILY（主店序列）：
     头部「本月累计」走 quotaInfo → SER，逐日表若读 DAILY，分店下两处会对不上
     （实测分店 4 头部 36,960、表格累计到 86,500）。 */
  const monthRows = SER.filter(r => r.d.slice(0,7) === q.mKey);
  let run = 0;
  const rows = monthRows.slice().reverse().map(r => {
    run += r.amt;
    return `<tr style="cursor:default" ${r.amt ? `data-bucket="${r.d}"` : ''}>
      <td>${r.d.slice(5)}</td><td>${r.amt?money(r.amt):'<span class="mono-weak">—</span>'}</td>
      <td>${money(run)}</td>
      <td>${pct(run/q.quota,1)}</td>
    </tr>`;
  }).join('');

  showDrawer('月度限额累计明细', `${q.mKey} 月 · 限额 ${money(q.quota)}`, `
    <div class="dgrid">
      <div class="dcell"><span>本月累计</span><b>${money(q.cum)}</b></div>
      <div class="dcell"><span>限额</span><b>${money(q.quota)}</b></div>
      <div class="dcell"><span>已用比例</span><b>${pct(q.ratio,1)}</b></div>
      <div class="dcell"><span>${q.level==='over'?'超出':'剩余'}</span><b class="${q.level==='over'?'warn':''}">${money(q.level==='over'?q.over:q.restBudget)}</b></div>
    </div>
    <div class="dnote">
      本月已过 ${q.covered} 天，日均 ${money(q.perDayCum)}；剩余 ${q.restDays} 天，日均可用 <b>${money(q.perDayLeft)}</b>。
      ${q.level==='over' ? '已经超过限额，注意排产和交付节奏。' : q.level==='warn' ? '已经进入 80% 预警区，建议提前规划。' : '额度充裕。'}
    </div>
    <div class="table-wrap" style="margin:0;padding:0">
      <table>
        <thead><tr><th>日期</th><th>当日</th><th>累计</th><th>占限额</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `, [{label:'改限额', go:'#/trade?g=' + st.g + '&p=' + st.p + '&a1=' + st.a[0] + '&a2=' + st.a[1] + '&cmp=' + (st.cmp?1:0) + '&q=' + st.q, primary:true}, {label:'关闭', drawer:'close'}]);
}

function openBucket(key, st){
  const g = st.g;
  const bs = buckets(st.a[0], st.a[1], g);
  const i = bs.findIndex(b => b.key === key);
  if (i < 0) return;
  const b = bs[i];
  const prev = bs[i-1];
  const crc = prev && prev.amt > 0 ? b.amt/prev.amt - 1 : null;
  const range = g === 'day' ? [key, key] : g === 'month' ? [key + '-01', key + '-' + daysInMonth(key)] : g === 'week' ? [key, addD(key,6)] : [key + '-01-01', key + '-12-31'];
  const r1 = clampD(range[0], DATA_START, DATA_END);
  const r2 = clampD(range[1], DATA_START, DATA_END);

  showDrawer(bucketTitle(key, g), `${b.covered} 天有数据${b.partial?`（该${GRAN[g]}共 ${b.span} 天，数据只覆盖 ${b.covered} 天）`:''}`, `
    <div class="dgrid">
      <div class="dcell"><span>支付金额</span><b>${money(b.amt)}</b></div>
      <div class="dcell"><span>日均</span><b>${money(b.covered?b.amt/b.covered:0)}</b></div>
      <div class="dcell"><span>占区间</span><b>${pct(b.amt / metrics(st.a[0],st.a[1]).amt, 1)}</b></div>
      <div class="dcell"><span>环比上${GRAN[g]}</span><b class="${crc!=null&&crc<0?'warn':''}">${crc==null?'—':signed(crc)}</b></div>
    </div>
    ${b.partial ? `<div class="dnote">这个${GRAN[g]}只有 <b>${b.covered} / ${b.span}</b> 天落在数据范围内，金额不能直接和完整${GRAN[g]}比。图表里用斜纹标出来了。</div>` : ''}
    <div class="dnote">
      ${b.amt === 0 ? '这个周期零成交。看当日是否断货、断码，或者只是没有成交。' : `这个周期贡献了区间 ${pct(b.amt / metrics(st.a[0],st.a[1]).amt, 1)} 的金额。`}
    </div>
  `, [
    {label:'在交易分析中看这段', go:'#/trade?g=day&p=custom&a1=' + r1 + '&a2=' + r2 + '&cmp=0&q=' + st.q + '&s=' + st.s, primary:true},
    {label:'关闭', drawer:'close'}
  ]);
}

/* 大屏堆叠柱专用抽屉：柱子高度是五店合计，抽屉必须同源。
   原来复用 openBucket（读全局 SER = 当前高亮店），同一根柱子切店前后点开是两个数：
   2026-10-08 柱高 62,010，高亮主店时说 49,000、高亮分店 4 时说 12,080。 */
/* 五店合计堆叠。原来直接嵌在大屏里，2026-10-20 起大屏那个位置改成主店四指标折线图，
   堆叠保留在抽屉中，点任意一根柱子仍可看该桶的五店明细。 */
function openStackTrend(st){
  const g = st.g;
  const bs = buckets(st.a[0], st.a[1], g, DAILY);
  const maps = STORES.map(s => ({s, map: storeBuckets(s, st.a[0], st.a[1], g)}));
  const sums = bs.map(b => maps.reduce((t,x) => t + (x.map.get(b.key) || 0), 0));
  const maxSum = Math.max(1, ...sums);
  const grand = sums.reduce((t,v) => t + v, 0);
  const step = Math.max(1, Math.ceil(bs.length / 10));
  const showLast = ((bs.length - 1) % step) >= Math.max(2, Math.ceil(step / 2));

  const groups = bs.map((b,i) => {
    const seg = [...maps].reverse().map(x => {
      const v = x.map.get(b.key) || 0;
      if (!v) return '';
      const idx = STORES.findIndex(s2 => s2.id === x.s.id);
      return `<i style="height:${(v / maxSum * 100).toFixed(2)}%;background:${STORE_COLORS[idx]}"></i>`;
    }).join('');
    const tip = `<b>${bucketTitle(b.key, g)}</b><br>合计 ${money(sums[i])}` +
      maps.map(x => `<br><em>${x.s.short}</em> ${money(x.map.get(b.key) || 0)}`).join('');
    return `<div class="stack-group" data-stack-bucket="${b.key}" data-tip="${esc(tip)}">${seg}</div>`;
  }).join('');

  const xs = bs.map((b,i) => `<span>${i % step === 0 || (showLast && i === bs.length - 1) ? b.label : ''}</span>`).join('');
  const legend = STORES.map((s,i) => `<span><i style="background:${STORE_COLORS[i]}"></i>${s.short}</span>`).join('');

  showDrawer('五店合计趋势', `${st.a[0]} ～ ${st.a[1]} · 按${GRAN[g]} · 五店合计 ${money(grand)}`, `
    <div class="chart-box" style="padding:0">
      <div class="stack">${groups}</div>
      <div class="chart-x">${xs}</div>
      <div class="legend">${legend}</div>
    </div>
    <div class="dnote">柱高 = 五店合计金额，点任意一根看该${GRAN[g]}的五店明细。主店为真实采集，其余 4 家按倍率生成，仅验证版式。</div>
  `, [{label:'关闭', drawer:'close'}]);
}

function openStackBucket(key, st){
  const g = st.g;
  const bs = buckets(st.a[0], st.a[1], g, DAILY);
  const i = bs.findIndex(b => b.key === key);
  if (i < 0) return;
  const b = bs[i];
  const perStore = STORES.map(s => ({s, v: storeBuckets(s, st.a[0], st.a[1], g).get(key) || 0}));
  const total = perStore.reduce((t, x) => t + x.v, 0);
  const prevTotal = i > 0
    ? STORES.reduce((t, s) => t + (storeBuckets(s, st.a[0], st.a[1], g).get(bs[i-1].key) || 0), 0)
    : 0;
  const crc = prevTotal > 0 ? total / prevTotal - 1 : null;
  const range = g === 'day' ? [key, key] : g === 'month' ? [key + '-01', key + '-' + daysInMonth(key)] : g === 'week' ? [key, addD(key,6)] : [key + '-01-01', key + '-12-31'];
  const r1 = clampD(range[0], DATA_START, DATA_END);
  const r2 = clampD(range[1], DATA_START, DATA_END);

  showDrawer(bucketTitle(key, g), `五店合计 · ${b.covered} 天有数据${b.partial?`（该${GRAN[g]}共 ${b.span} 天，数据只覆盖 ${b.covered} 天）`:''}`, `
    <div class="dgrid">
      <div class="dcell"><span>五店合计</span><b>${money(total)}</b></div>
      <div class="dcell"><span>主店占比</span><b>${pct(total ? perStore[0].v/total : 0, 1)}</b></div>
      <div class="dcell"><span>环比上${GRAN[g]}</span><b class="${crc!=null&&crc<0?'warn':''}">${crc==null?'—':signed(crc)}</b></div>
    </div>
    <div class="table-wrap" style="margin:10px 0 0;padding:0">
      <table>
        <thead><tr><th>店铺</th><th>金额</th><th>占合计</th></tr></thead>
        <tbody>${perStore.map(x => `<tr style="cursor:default">
          <td>${esc(x.s.short)}${x.s.real?'':' <span class="src demo">演示</span>'}</td>
          <td>${money(x.v)}</td>
          <td>${pct(total ? x.v/total : 0, 1)}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
    <div class="dnote">柱子高度 = 五店合计 ${money(total)}，与本图 tooltip 完全一致。单店明细请进「交易分析」后切换店铺。</div>
  `, [
    {label:'在交易分析中看这段', go:'#/trade?g=day&p=custom&a1=' + r1 + '&a2=' + r2 + '&cmp=0&q=' + st.q + '&s=' + st.s, primary:true},
    {label:'关闭', drawer:'close'}
  ]);
}

/* ══════════════════════════════════════════════════════════════════════════
   渲染与事件
   ══════════════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════════════
   分店演示视图
   ──────────────────────────────────────────────────────────────────────────
   4 家分店还没接入采集，但页面必须能切店看数。做法：渲染前把主店常量按
   ratio 就地等比缩放，渲染完立刻还原（同步渲染，不会串页）。
   · 计数类（金额 / 访客 / 买家 / 加购 / 收藏 / 花费）缩放；
   · 比率、时长、评分、活动状态不缩放；
   · 同时 FORCE_DEMO = true，整页 KPI 徽标统一变「演示」。
   ══════════════════════════════════════════════════════════════════════════ */
const DEMO_KEEP  = new Set(['status','kwCtr','firstRespSec']);
const keepKey   = k => DEMO_KEEP.has(k) || /crc$/i.test(k) || /rate$/i.test(k) || /ratio$/i.test(k);
/* 只放计数类。payPct 是客单价（金额 ÷ 买家），属比率量纲，不随店铺规模变化，
   此前误放进这里，分店 4 会被缩成 ¥475。当前页面只读它的环比 .c 才没暴露。 */
const AGG_SCALE = new Set(['payAmt','payByrCnt','uv','pv','cartByrCnt','itmUv']);

/* 快照用栈，不用单槽。单槽时若在未 pop 的情况下二次 pushDemoStore，
   前一次快照会被覆盖 → 常量被复合缩放（0.4 × 0.4）且永远还原不回来。 */
const _demoStack = [];

function pushDemoStore(s){
  FORCE_DEMO = false;
  if (s.real) return;
  FORCE_DEMO = true;
  const k = s.ratio;
  const snap = [];
  const sc = v => { const r = Math.round(v * k); return v > 0 && r === 0 ? 1 : r; };
  const put = (obj, key, val) => { snap.push([obj, key, obj[key]]); obj[key] = val; };

  for (const key of AGG_SCALE) put(AGG[key], 'v', Math.round(AGG[key].v * k));

  const walk = node => {
    if (!node || typeof node !== 'object') return;
    if (Array.isArray(node)){
      node.forEach((v, i) => {
        if (typeof v === 'number') put(node, i, sc(v));
        else walk(v);
      });
      return;
    }
    for (const key of Object.keys(node)){
      const v = node[key];
      if (typeof v === 'number' && !keepKey(key)) put(node, key, sc(v));
      else if (v && typeof v === 'object') walk(v);
    }
  };
  /* REFUND 必须在这个列表里。此前遗漏导致分店页退款金额仍是主店的 ¥500，
     与该店已缩放的支付金额对不上，同页两个数字互相矛盾（隐含退款率 1.16%
     对页面标称的 0.46%）。amtRate / ordRate 以 rate 结尾，被 keepKey 拦住不缩放。 */
  [ITEMS, BUYERS, SERVICE, ADS, CONTENT, CONTENT_MORE, CHANNELS, AREAS, KEYWORDS, FLOW_SPLIT, ACTIVITIES, REFUND].forEach(walk);

  _demoStack.push(snap);
}

function popDemoStore(){
  /* 栈空是正常情况（render 每次开头都会 pop 一次），不要报警；
     只有嵌套未配对时 FORCE_DEMO 才继续保持 true。 */
  if (!_demoStack.length){ FORCE_DEMO = false; return; }
  const snap = _demoStack.pop();
  for (const [o, key, v] of snap) o[key] = v;
  FORCE_DEMO = _demoStack.length > 0;
}

/* 上一次渲染的路由。用来区分「换页」和「同页重渲染」：
   换页该回到顶部，同页改筛选（切店 / 切区间 / 排序 / 图例勾选）必须保持阅读位置。
   此前 render() 末尾无条件 scrollTop = 0，导致页面上任何会重渲染的按钮
   都会把用户弹回顶部。 */
let _lastRouteRender = null;

function render(){
  const st = readState();
  const el = document.getElementById('content');
  /* 重写 innerHTML 会清空 scrollTop，所以必须在写之前读出来 */
  const sameRoute = _lastRouteRender === st.route;
  const keepTop = sameRoute ? el.scrollTop : 0;

  /* 先还原上一页的分店视图，侧栏 / 顶栏也要读未缩放的原值 */
  popDemoStore();
  renderSidebar(st);
  renderTopbar(st);

  const PAGES = {
    screen: pageOverview,
    trade:  pageTrade,
    items:  pageItems,
    flow:   pageFlow,
    service:pageService,
    ads:    pageAds,
    content:pageContent
  };
  try {
    /* 视图**不**在渲染后还原：抽屉、表格行点开时还要读同一套数值，
       下一次 render 开头会 pop，所以不会越积越多。 */
    const s = storeOf(st.s);
    SER = storeSeries(s);
    /* 大屏要同时看 5 家，不能把常量缩成单店 */
    if (st.route !== 'screen') pushDemoStore(s);
    el.innerHTML = (PAGES[st.route] || pageOverview)(st);
  } catch (err) {
    popDemoStore();
    SER = DAILY;
    el.innerHTML = '<div style="padding:40px 0;color:#b42318;font:13px/1.7 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap">'
      + '页面渲染失败（route=' + st.route + '，store=' + st.s + '）\n\n'
      + String(err && err.stack ? err.stack : err) + '</div>';
    console.error(err);
  }
  el.scrollTop = keepTop;
  _lastRouteRender = st.route;
}

/* 浮层提示 */
const gtip = document.createElement('div');
gtip.className = 'gtip';
document.body.appendChild(gtip);
document.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) return;
  gtip.innerHTML = t.dataset.tip;
  gtip.classList.add('on');
  const r = t.getBoundingClientRect();
  gtip.style.left = Math.min(window.innerWidth - 12, Math.max(12, r.left + r.width/2)) + 'px';
  gtip.style.top = (r.top - 8) + 'px';
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('[data-tip]')) gtip.classList.remove('on');
});

/* 点击委托 */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-set],[data-go],[data-drawer],[data-stack-bucket],[data-bucket],[data-item],[data-channel],[data-area],[data-kw],[data-sort],[data-toggle]');
  if (!el) return;
  const st = readState();

  if (el.dataset.sort){
    const k = el.dataset.sort;
    itemSort = {key:k, dir: itemSort.key === k ? -itemSort.dir : -1};
    /* 必须走 render()：排序只改顺序，但 render 会重新执行 pushDemoStore。
       直接 innerHTML = pageItems(st) 会跳过缩放，分店页一点排序就露出主店真实数据。 */
    render();
    return;
  }
  if (el.dataset.set){ applySet(el.dataset.set); return; }
  if (el.dataset.go){ go(el.dataset.go); return; }
  if (el.dataset.item){ openItem(el.dataset.item, st); return; }
  if (el.dataset.channel){ openChannel(el.dataset.channel, st); return; }
  if (el.dataset.area){ openArea(el.dataset.area, st); return; }
  if (el.dataset.kw){ openKw(el.dataset.kw, st); return; }
  if (el.dataset.stackBucket){ openStackBucket(el.dataset.stackBucket, st); return; }
  if (el.dataset.bucket){ openBucket(el.dataset.bucket, st); return; }
  if (el.dataset.drawer){
    const d = el.dataset.drawer;
    if (d === 'close') closeDrawer();
    else if (d === 'refund') openRefund(st);
    else if (d === 'quota') openQuota(st);
    else if (d === 'stacktrend') openStackTrend(st);
    else if (d === 'buyer:new') openBuyer('new', st);
    else if (d === 'buyer:old') openBuyer('old', st);
    else if (d.startsWith('content:')) openContent(d.split(':')[1], st);
    return;
  }
});

/* 日期 / 限额输入 */
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.date){
    const v = el.value;
    if (!v) return;
    applySet(el.dataset.date + '=' + v);
  }
  if (el.hasAttribute('data-quota')){
    const v = Number(el.value);
    if (v > 0) applySet('q=' + Math.round(v));
  }
});

mask.addEventListener('click', closeDrawer);
document.getElementById('dClose').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (drawer.classList.contains('on')) closeDrawer();
    else if (readState().route === 'screen'){
      const st = readState();
      go('#/trade?g=' + st.g + '&p=' + st.p + '&a1=' + st.a[0] + '&a2=' + st.a[1] + '&cmp=' + (st.cmp?1:0) + '&q=' + st.q + '&s=' + st.s);
    }
  }
});

window.addEventListener('hashchange', () => render());

/* 启动 */
if (!location.hash || location.hash === '#' || location.hash === '#/') location.hash = '#/screen';
render();
</script>
