<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>运维信息平台 · 梵禾 Work（效果预览）</title>
<style>
/* ── 设计令牌：与 apps/web/src/index.css 的「方案 B 现代极简」逐项对齐 ───────── */
:root{
  color-scheme: light;
  --radius:8px;
  --background:#fafafa; --foreground:#09090b;
  --card:#ffffff; --card-foreground:#09090b; --popover:#ffffff;
  --primary:#18181b; --primary-foreground:#fafafa;
  --secondary:#f4f4f5; --muted:#f4f4f5;
  --muted-foreground:#52525b; --muted-foreground-weak:#71717a;
  --accent:#f4f4f5; --accent-foreground:#18181b;
  --destructive:#dc2626; --destructive-foreground:#fff;
  --border:#e4e4e7; --border-soft:#f1f1f3; --ring:#18181b;
  --m-neutral:#52525b; --m-teal:#0f6e56; --m-blue:#185fa5; --m-purple:#534ab7; --m-amber:#854f0b;
  --shadow-card:0 4px 30px rgb(0 0 0 / .1);
  --shadow-pop:0 4px 16px rgb(0 0 0 / .06);
  --up:#d92d20; --down:#067647;
}
/* 深色令牌块已随 v3「删除深色全屏大屏」一并移除；本页只有浅色一套。 */
*{box-sizing:border-box; margin:0; padding:0; border-color:var(--border)}
html,body{height:100%}
body{
  background:var(--background); color:var(--foreground);
  font-family:'Noto Sans SC','FH Sans SC','PingFang SC','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.5;
}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
input{font:inherit; color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--foreground) 18%,transparent);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ── 外壳：侧栏 240 / 顶栏 72 / 内容 px-48 pt-20 ───────────────────────── */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:240px;flex:none;display:flex;flex-direction:column;gap:14px;
  border-right:1px solid var(--border-soft);background:var(--background);
  padding:16px 12px 12px;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 10px}
.brand-logo{
  width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:var(--primary);color:var(--primary-foreground);font-size:13px;font-weight:700;letter-spacing:-.5px;
}
.brand-name{font-size:16px;font-weight:500;letter-spacing:-.2px}
.nav-group{display:flex;flex-direction:column;gap:4px}
.nav-head{
  display:flex;height:32px;align-items:center;gap:10px;padding:0 10px;border-radius:12px;
  font-size:12px;color:var(--muted-foreground);width:100%;text-align:left;
}
.nav-head:hover{background:var(--accent);color:var(--foreground)}
.nav-head .chev{margin-left:auto;opacity:.6;transition:transform .2s ease-out}
.nav-group.collapsed .chev{transform:rotate(-90deg)}
.nav-group.collapsed .nav-body{display:none}
.nav-body{display:flex;flex-direction:column;gap:4px}
.nav-item{
  display:flex;height:32px;align-items:center;gap:10px;padding:0 10px;border-radius:12px;
  color:var(--muted-foreground);width:100%;text-align:left;
}
.nav-item:hover{background:var(--accent);color:var(--foreground)}
.nav-item.sub{padding-left:38px}
.nav-item.active{background:var(--accent);color:var(--foreground);font-size:15px;font-weight:400}
.nav-item.ghost{color:var(--muted-foreground-weak)}
.nav-item .tag{margin-left:auto;font-size:11px;color:var(--muted-foreground-weak);font-style:normal}
.nav-div{display:flex;align-items:center;gap:8px;padding:9px 10px 1px;font-size:10.5px;color:var(--muted-foreground-weak);letter-spacing:.4px}
.nav-div::after{content:'';flex:1;height:1px;background:var(--border-soft)}
.topbar-store{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-foreground);padding:3px 9px;border:1px solid var(--border);border-radius:99px}
.topbar-store em{font-style:normal;font-size:10px;color:var(--m-amber);border:1px solid color-mix(in srgb,var(--m-amber) 35%,var(--border));border-radius:3px;padding:0 3px;line-height:1.5}
.dot{width:6px;height:6px;border-radius:99px;background:currentColor;opacity:.55;flex:none}
.sidebar-foot{margin-top:auto;display:flex;gap:6px;padding:6px 4px 0;border-top:1px solid var(--border-soft)}
.icon-btn{width:32px;height:32px;border-radius:12px;display:grid;place-items:center;color:var(--muted-foreground)}
.icon-btn:hover{background:var(--accent);color:var(--foreground)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:72px;flex:none;display:flex;align-items:center;gap:10px;
  padding:0 48px;border-bottom:1px solid var(--border-soft);
}
.crumb{font-size:13px;color:var(--muted-foreground);display:flex;align-items:center;gap:7px}
.crumb b{font-weight:500;color:var(--foreground)}
.crumb .link{cursor:pointer}
.crumb .link:hover{color:var(--foreground)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.avatar{
  width:30px;height:30px;border-radius:99px;display:grid;place-items:center;font-size:12px;
  background:var(--primary);color:var(--primary-foreground);
}
.user-meta{font-size:12px;color:var(--muted-foreground);line-height:1.3}
.user-meta strong{display:block;font-size:13px;font-weight:500;color:var(--foreground)}

.content{flex:1;overflow-y:auto;padding:20px 48px 64px}

/* ── 页头 ─────────────────────────────────────────────────────────────── */
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px}
.page-title{font-size:22px;font-weight:500;letter-spacing:-.3px}
.page-sub{margin-top:6px;font-size:13px;color:var(--muted-foreground)}
.page-sub .sep{margin:0 8px;color:var(--border)}

/* ── 时间条 ───────────────────────────────────────────────────────────── */
.timebar{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;
  padding:10px 14px;border:1px solid var(--border);border-radius:12px;background:var(--card);
  margin-bottom:14px;box-shadow:var(--shadow-pop);
}
.tb-item{display:inline-flex;align-items:center;gap:7px}
.tb-label{font-size:12px;color:var(--muted-foreground-weak);flex:none}
.seg{display:inline-flex;padding:2px;border:1px solid var(--border);border-radius:9px;background:var(--card)}
.seg button{
  padding:4px 11px;border-radius:7px;font-size:12.5px;color:var(--muted-foreground);
  transition:background .16s,color .16s;white-space:nowrap;
}
.seg button:hover{color:var(--foreground)}
.seg button[aria-selected="true"]{background:var(--primary);color:var(--primary-foreground)}
.date-in{
  border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-size:12.5px;
  background:var(--card);color:var(--foreground);font-variant-numeric:tabular-nums;
}
.date-in:focus{outline:2px solid color-mix(in srgb,var(--ring) 20%,transparent);outline-offset:1px}
.tb-btn{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--border);
  border-radius:9px;font-size:12.5px;color:var(--muted-foreground);background:var(--card);
}
.tb-btn:hover{color:var(--foreground);border-color:color-mix(in srgb,var(--foreground) 25%,var(--border))}
.tb-btn[aria-pressed="true"]{
  background:var(--primary);color:var(--primary-foreground);border-color:var(--primary);
}
.tb-note{font-size:11.5px;color:var(--muted-foreground-weak);margin-left:auto}
.tb-warn{font-size:11.5px;color:var(--up)}

/* ── 页头右侧店铺切换 ─────────────────────────────────────────────────── */
.store-seg{display:inline-flex;align-items:center;gap:8px;margin-left:auto;flex:none}
.store-seg .seg button{display:inline-flex;align-items:center;gap:5px}
.store-seg .seg button .dim{
  width:5px;height:5px;border-radius:50%;background:var(--m-amber);display:inline-block;
}

/* ── 卡片 ─────────────────────────────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-card)}
.card-head{display:flex;align-items:center;gap:8px;padding:16px 18px 0}
.card-title{font-size:15px;font-weight:500}
.card-note{margin-left:auto;font-size:12px;color:var(--muted-foreground-weak)}

/* ── KPI ──────────────────────────────────────────────────────────────── */
.kpi-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1500px){.kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{padding:14px 16px 15px;position:relative;transition:border-color .16s,box-shadow .16s}
.kpi.kpi-click{cursor:pointer}
.kpi.kpi-click:hover{border-color:color-mix(in srgb,var(--foreground) 22%,var(--border))}
.kpi-label{font-size:12px;color:var(--muted-foreground);display:flex;align-items:center;gap:6px}
.kpi-label .tip{font-size:11px;color:var(--muted-foreground-weak);border:1px solid var(--border);border-radius:4px;padding:0 4px}
.src{
  margin-left:auto;font-size:10px;letter-spacing:.2px;padding:0 4px;border-radius:4px;flex:none;
  border:1px solid var(--border);color:var(--muted-foreground-weak);line-height:1.5;
}
.src.exact{color:var(--m-teal);border-color:color-mix(in srgb,var(--m-teal) 35%,var(--border))}
.src.est{color:var(--m-amber);border-color:color-mix(in srgb,var(--m-amber) 30%,var(--border))}
.src.fixed{color:var(--muted-foreground-weak);border-style:dashed}
.kpi-value{margin-top:9px;font-size:26px;font-weight:500;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kpi-value small{font-size:14px;font-weight:400;color:var(--muted-foreground);margin-right:2px;letter-spacing:0}
.kpi-delta{margin-top:7px;display:flex;align-items:center;gap:5px;font-size:12px;font-variant-numeric:tabular-nums}
.pill{padding:1px 6px;border-radius:5px;font-size:11px;font-variant-numeric:tabular-nums}
.pill.up{color:var(--up);background:color-mix(in srgb,var(--up) 10%,transparent)}
.pill.down{color:var(--down);background:color-mix(in srgb,var(--down) 10%,transparent)}
.pill.flat{color:var(--muted-foreground);background:var(--muted)}
.kpi-sub{margin-top:7px;font-size:11px;color:var(--muted-foreground-weak)}
.kpi-sub b{font-weight:500;color:var(--muted-foreground)}
.kpi-go{
  position:absolute;right:14px;bottom:12px;font-size:11px;color:var(--muted-foreground-weak);
  opacity:0;transition:opacity .16s;
}
.kpi-click:hover .kpi-go{opacity:1}
.kpi-foot{margin-top:12px;font-size:11px;color:var(--muted-foreground-weak);line-height:1.7}
.kpi-foot b{font-weight:500;color:var(--muted-foreground)}

/* ── 双栏 ─────────────────────────────────────────────────────────────── */
.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:12px;margin-top:12px}
.split.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1240px){.split,.split.even{grid-template-columns:minmax(0,1fr)}}

/* ── 柱状图 ───────────────────────────────────────────────────────────── */
.chart-box{padding:14px 18px 16px;flex:1;display:flex;flex-direction:column}
.chart-card{display:flex;flex-direction:column}
.chart-card .chart-box{justify-content:flex-end}
.chart{position:relative;height:212px;display:flex;align-items:flex-end;gap:3px;flex:1;min-height:150px}
.bgroup{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;cursor:pointer;position:relative;border-radius:4px}
.bgroup:hover{background:color-mix(in srgb,var(--foreground) 4%,transparent)}
.bar{flex:1;min-width:0;max-width:44px;border-radius:3px 3px 0 0;background:color-mix(in srgb,var(--m-neutral) 42%,var(--card));min-height:2px;transition:background .12s}
.bar.peak{background:var(--m-neutral)}
.bar.zero{background:var(--border);min-height:2px;border-radius:2px}
.bar.b{background:color-mix(in srgb,var(--m-blue) 45%,var(--card))}
.bar.partial{background-image:repeating-linear-gradient(135deg,rgb(255 255 255 / .38) 0 4px,transparent 4px 9px)}
.bgroup{justify-content:center}
.bgroup .bar:only-child{max-width:56px}
.bgroup:hover .bar{background:var(--primary)}
.bgroup:hover .bar.b{background:var(--m-blue)}
.chart-x{display:flex;gap:3px;margin-top:7px;padding:0 1px}
.chart-x span{flex:1;min-width:0;text-align:center;font-size:10px;color:var(--muted-foreground-weak);font-variant-numeric:tabular-nums;white-space:nowrap}
.chart-x span:first-child:not(:last-child){text-align:left}
.chart-x span:last-child:not(:first-child){text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:11px;color:var(--muted-foreground-weak)}

/* ── 折线图（大屏四指标） ────────────────────────────────────────────── */
.line-chart{width:100%;height:auto;display:block;overflow:visible}
.line-chart .grid{stroke:var(--border);stroke-width:1;stroke-dasharray:2 4}
.line-chart .axis-x{font-size:10px;fill:var(--muted-foreground-weak);font-variant-numeric:tabular-nums}
.line-chart .line{fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.line-chart .dot{stroke:var(--card);stroke-width:1.4}
.line-chart .hit{fill:transparent;cursor:crosshair}
.line-chart .hit:hover{fill:color-mix(in srgb,var(--foreground) 4%,transparent)}
.chart-foot{margin-top:9px;font-size:11px;color:var(--muted-foreground-weak);line-height:1.6}
.chart-foot b{font-weight:500;color:var(--muted-foreground);font-variant-numeric:tabular-nums}

/* 图例勾选框：放在图表区域右上角 */
.lg-legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.lg-item{display:inline-flex;align-items:center;gap:5px;padding:3px 8px 3px 7px;border:1px solid var(--border);border-radius:7px;background:var(--card);font-size:11px;color:var(--muted-foreground-weak);cursor:pointer;transition:border-color .12s,color .12s}
.lg-item:hover{border-color:color-mix(in srgb,var(--foreground) 22%,var(--border))}
.lg-item.on{color:var(--foreground)}
.lg-item i{width:12px;height:3px;border-radius:2px;flex:none}
.lg-item .cb{width:11px;height:11px;border-radius:3px;border:1px solid color-mix(in srgb,var(--foreground) 28%,transparent);display:inline-flex;align-items:center;justify-content:center;font-size:9px;line-height:1;color:transparent;flex:none}
.lg-item.on .cb{background:var(--foreground);border-color:var(--foreground);color:var(--card)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend i.hatch{background:repeating-linear-gradient(135deg,var(--m-neutral) 0 3px,rgb(255 255 255 / .6) 3px 6px)}

/* 浮动提示（全站统一，事件委托驱动） */
.gtip{
  position:fixed;z-index:90;pointer-events:none;opacity:0;transform:translate(-50%,-100%);
  background:var(--popover);border:1px solid var(--border);border-radius:8px;padding:6px 9px;
  font-size:12px;box-shadow:0 6px 24px rgb(0 0 0 / .14);white-space:nowrap;transition:opacity .1s;
  color:var(--foreground);line-height:1.5;
}
.gtip.on{opacity:1}
.gtip b{font-weight:500}
.gtip em{font-style:normal;color:var(--muted-foreground-weak)}

/* ── 限额 ─────────────────────────────────────────────────────────────── */
.quota-card{padding:16px 18px 18px}
.quota-top{display:flex;align-items:baseline;gap:8px}
.quota-big{font-size:26px;font-weight:500;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.quota-big small{font-size:14px;font-weight:400;color:var(--muted-foreground);margin-right:2px}
.quota-cap{margin-left:auto;font-size:12.5px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.prog{position:relative;height:12px;border-radius:99px;background:var(--muted);margin:14px 0 6px}
.prog i{display:block;height:100%;border-radius:99px;background:var(--m-neutral);transition:width .35s cubic-bezier(.4,0,.2,1);max-width:100%}
.prog.warn i{background:var(--m-amber)}
.prog.over i{background:var(--up)}
.prog .tick{position:absolute;top:-5px;bottom:-5px;width:2px;border-radius:2px;background:var(--foreground);opacity:.45;z-index:2}
.prog .tick.warn{opacity:.5;background:#fff;box-shadow:0 0 0 1px rgb(0 0 0 / .18)}
.prog .cap{position:absolute;top:17px;font-size:10.5px;color:var(--muted-foreground-weak);white-space:nowrap}
.quota-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:26px;font-size:11px;color:var(--muted-foreground-weak)}
.quota-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.quota-legend b{font-weight:500;color:var(--muted-foreground)}
.quota-edit{margin-top:13px;padding-top:13px;border-top:1px solid var(--border-soft)}
.quota-row{display:flex;align-items:center;gap:8px}
.quota-row + .quota-row{margin-top:8px}
.quota-row .date-in{width:104px;text-align:right;flex:none}
.quota-row .tb-label{flex:none}
.quota-preset{display:flex;gap:6px;margin-left:auto}
.quota-preset .tb-btn{padding:4px 9px;font-size:12px}
.quota-state{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:6px;
}
.quota-state.safe{color:var(--m-teal);background:color-mix(in srgb,var(--m-teal) 10%,transparent)}
.quota-state.warn{color:var(--m-amber);background:color-mix(in srgb,var(--m-amber) 12%,transparent)}
.quota-state.over{color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent)}
.alert{
  display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;margin-bottom:12px;
  background:color-mix(in srgb,var(--up) 7%,var(--card));
  border:1px solid color-mix(in srgb,var(--up) 32%,var(--border));
  font-size:13px;color:var(--foreground);
}
.alert .a-badge{
  flex:none;font-size:11px;padding:2px 7px;border-radius:5px;font-weight:500;
  background:var(--up);color:#fff;
}
.alert b{color:var(--up);font-weight:500}
.alert .a-go{margin-left:auto;flex:none;font-size:12px;color:var(--up);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* ── 表格 ─────────────────────────────────────────────────────────────── */
.table-wrap{overflow:auto;margin:0 -18px -18px;padding:0 18px 6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{
  text-align:right;font-size:11px;font-weight:400;color:var(--muted-foreground-weak);
  padding:0 10px 9px;white-space:nowrap;border-bottom:1px solid var(--border-soft);
}
th:first-child{text-align:left;padding-left:2px}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--foreground)}
th .sort-ind{opacity:.35;margin-left:3px;font-size:9px}
th.sorted{color:var(--foreground)}
th.sorted .sort-ind{opacity:1}
td{padding:11px 10px;border-bottom:1px solid var(--border-soft);text-align:right;font-size:13px}
td:first-child{text-align:left;padding-left:2px}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--accent)}
tbody tr:last-child td{border-bottom:0}
.item-name{display:flex;align-items:center;gap:9px;max-width:520px}
.item-thumb{width:30px;height:30px;border-radius:7px;flex:none;background:var(--muted);display:grid;place-items:center;font-size:11px;color:var(--muted-foreground-weak)}
.item-text{overflow:hidden}
.item-text b{display:block;font-weight:400;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-text span{font-size:11px;color:var(--muted-foreground-weak)}
.rate{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
.rate i{display:block;width:44px;height:4px;border-radius:99px;background:var(--muted);overflow:hidden}
.rate i u{display:block;height:100%;background:var(--m-neutral)}
.rate.hi u{background:var(--m-teal)}
.rate.lo u{background:var(--up)}
.mono-weak{color:var(--muted-foreground-weak)}
.zero-tag{font-size:11px;color:var(--up)}

/* 对比 */
.tagA,.tagB{font-size:10px;padding:1px 5px;border-radius:4px;font-weight:500;letter-spacing:.3px;flex:none}
.tagA{background:var(--m-neutral);color:#fff}
.tagB{background:color-mix(in srgb,var(--m-blue) 80%,#fff);color:#fff}
.cmp-hero{display:grid;grid-template-columns:minmax(0,1fr) 116px minmax(0,1fr);gap:20px;align-items:center;padding:16px 18px 8px}
.cmp-hero .side{text-align:center}
.cmp-hero .side span{font-size:11.5px;color:var(--muted-foreground-weak);display:flex;align-items:center;gap:6px;justify-content:center}

<script>
/* ══════════════════════════════════════════════════════════════════════════
   数据层
   全部取自 data/csv30 的 30 天导出（2026-09-19 ～ 2026-10-18），未做任何编造。
   逐日序列只有「支付金额」一条，其余指标是接口给的 30 天区间聚合值。

const DATA_START = '2026-09-19';

const SAMPLE_DAYS = 30;

/* DATA:BEGIN DAILY */
const DAILY = [
  ['2026-09-19',1760],['2026-09-20',1760],['2026-09-21',1760],['2026-09-22',1760],

/* DATA:END AGG */

/* 不可变基准。metricsFor 给分店算指标时要自己乘 ratio，必须读这里的原值。

const BYR_BASE = AGG.payByrCnt.v;

const REFUND = {

/* DATA:BEGIN CHANNELS */

const D = s => new Date(s + 'T00:00:00');
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const addD = (s,n) => { const d = D(s); d.setDate(d.getDate()+n); return iso(d); };

/* 大屏折线图的四条曲线。顺序即图例顺序，颜色取设计令牌。

/* ══════════════════════════════════════════════════════════════════════════
   状态：URL hash 是唯一状态源
   #/trade?g=day&p=30d&a1=&a2=&cmp=0&b1=&b2=&q=80000
   ══════════════════════════════════════════════════════════════════════════ */
function presetRange(p){
  /* 单日默认落在「最后一个有成交的日子」。数据尾几天是 0，若默认取 DATA_END
     整屏全是 ¥0，看起来像坏了，实际是那天真没出单。 */
  if (p === 'd1'){
    const last = DAILY.filter(r => r.amt > 0).slice(-1)[0];
    const d = last ? last.d : DATA_END;
    return [d, d];
  }
  if (p === '7d')  return [addD(DATA_END,-6), DATA_END];
  if (p === '30d') return [DATA_START, DATA_END];
  if (p === 'tm')  return [DATA_END.slice(0,8) + '01', DATA_END];
  if (p === 'lm'){
    const end = addD(DATA_END.slice(0,8) + '01', -1);
    return [end.slice(0,8) + '01', end];
  }
  return [DATA_START, DATA_END];
}

/* 对比基线：取 A 之前紧邻的等长区间（pe = a-1，ps = pe-(n-1)）。
   历史不足时返回 null，由调用方显式渲染「无可比区间」，不再退化成别的东西。
   旧实现在越界时退化成「A 的前半段」，B 完全落在 A 内部，等于拿本期前半段
   当本期基线，环比数字没有业务含义，已废弃。 */
function defaultB([a,b]){
  const n = diffD(a,b) + 1;
  const pe = addD(a,-1);
  const ps = addD(pe,-(n-1));
  if (ps < DATA_START) return null;
  return [ps, pe];
}

function readState(){
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, qs] = raw.split('?');
  const q = new URLSearchParams(qs || '');
  const route = ['screen','trade','items','flow','service','ads','content'].includes(path) ? path : 'screen';
  const g = ['day','week','month','year'].includes(q.get('g')) ? q.get('g') : 'day';
  const p = ['d1','7d','30d','tm','lm','custom'].includes(q.get('p')) ? q.get('p') : '30d';

  let a;
  if ((p === 'custom' || p === 'd1') && q.get('a1') && q.get('a2')){
    a = [clampD(q.get('a1'),DATA_START,DATA_END), clampD(q.get('a2'),DATA_START,DATA_END)];
    if (a[0] > a[1]) a = [a[1],a[0]];
  } else {
    a = presetRange(p);
    a = [clampD(a[0],DATA_START,DATA_END), clampD(a[1],DATA_START,DATA_END)];
  }

  let b;
  if (q.get('b1') && q.get('b2')){
    b = [clampD(q.get('b1'),DATA_START,DATA_END), clampD(q.get('b2'),DATA_START,DATA_END)];
    if (b[0] > b[1]) b = [b[1],b[0]];
  } else b = defaultB(a);

  const qv = Number(q.get('q'));
  const sid = q.get('s');
  const sOk = STORES.some(x => x.id === sid);
  /* 非法 s（例如手改成 s=s9）回落主店时，把地址栏也改回来，
     否则地址栏留着 s=s9、页面是主店，刷新后依然是主店，形成隐性不一致。
     用 replaceState 而不是赋值 hash，避免再触发一次 hashchange。 */
  if (sid && !sOk){
    try { history.replaceState(null, '', location.hash.replace(/([?&])s=[^&]*/, '$1s=main')); } catch (e) {}
  }
  return {
    route, g, p, a, b,
    s: sOk ? sid : 'main',
    cmp: q.get('cmp') === '1',
    q: qv > 0 ? qv : 80000,
    /* 大屏折线图的勾选状态。参数缺省 = 四项全开；显式空值 = 全关。
       存进 URL 是为了与「地址栏是唯一状态源」的约定保持一致，分享链接能带上勾选。 */
    ls: q.get('ls') === null ? LS_ALL.slice() : q.get('ls').split(',').filter(k => LS_ALL.includes(k))
  };
}

function hashOf(st){
  return '#/' + st.route +
    '?g=' + st.g + '&p=' + st.p +
    '&a1=' + st.a[0] + '&a2=' + st.a[1] +
    '&cmp=' + (st.cmp?1:0) + (st.b ? '&b1=' + st.b[0] + '&b2=' + st.b[1] : '') +
    '&q=' + st.q + '&s=' + st.s + '&ls=' + (st.ls || LS_ALL).join(',');
}

function applySet(expr){
  const st = readState();
  expr.split('&').forEach(kv => {
    const [k,v] = kv.split('=');
    if (k === 'g') st.g = v;
    else if (k === 'p'){
      st.p = v;
      if (v !== 'custom'){
        const r = presetRange(v);
        st.a = [clampD(r[0],DATA_START,DATA_END), clampD(r[1],DATA_START,DATA_END)];
        st.b = defaultB(st.a);
      }
    }
    else if (k === 'cmp') st.cmp = v === '1';
    else if (k === 's')   st.s = v;
    else if (k === 'q')  st.q = Math.max(1, Number(v) || st.q);
    /* 图例勾选：v 是勾选后剩下的指标列表，空字符串表示四项全关 */
    else if (k === 'ls') st.ls = v ? v.split(',').filter(x => LS_ALL.includes(x)) : [];
    else if (k === 'a1'){ st.a[0] = clampD(v,DATA_START,DATA_END); st.p = 'custom'; }
    else if (k === 'a2'){ st.a[1] = clampD(v,DATA_START,DATA_END); st.p = 'custom'; }
    /* st.b 可能为 null（历史不足）。手动改 B 日期时要先把 B 建出来，
       否则 st.b[0] 会抛 TypeError。 */
    else if (k === 'b1'){ const d = clampD(v,DATA_START,DATA_END); st.b = st.b ? [d, st.b[1]] : [d, d]; }
    else if (k === 'b2'){ const d = clampD(v,DATA_START,DATA_END); st.b = st.b ? [st.b[0], d] : [d, d]; }
  });
  if (st.a[0] > st.a[1]) st.a = [st.a[1], st.a[0]];
  if (st.b && st.b[0] > st.b[1]) st.b = [st.b[1], st.b[0]];
  if (st.p === 'custom' && st.a[0] === st.a[1]) st.p = 'd1';
  if (st.p === 'custom' && !(st.a[0] > DATA_START || st.a[1] < DATA_END)) st.p = '30d';
  go(hashOf(st));
}

function go(hash){
  closeDrawer();
  if (!/[?&]s=/.test(hash)){
    const st = readState();
    hash += (hash.includes('?') ? '&' : '?') + 's=' + st.s;
  }
  if (location.hash === hash){ render(); return; }
  location.hash = hash;
}

/* 当前店铺的日序列。主店 = 真实 DAILY，分店 = 确定性伪序列。
   渲染前由 render() 设定，slice / buckets / quotaInfo / metrics 全部跟着切店。 */
let SER = DAILY;
function slice(a,b){ return SER.filter(r => r.d >= a && r.d <= b); }

/* 区间指标。
   amt 由逐日序列精确求和，不做任何折算。
   byr / uv 分三种来源，用 basis 标记，页面据此出徽标：
     daily 主店非整段，逐日真值求和（DAILY_FLOW）
     agg   主店整段，接口去重聚合值

   跳失率、退款、地域、搜索词只有整段值，不参与区间重算。 */
/* ser 显式传入时必须用传入的序列。大屏要同时算五家店，
   如果主店也走全局 SER（= 当前高亮店），主店卡会显示高亮店的数字，
   页脚五店合计也会跟着变（实测聚焦分店 4 时主店卡从 108,000 掉到 43,200）。 */
function metrics(a,b,ser){
  const src = ser || SER;
  const rows = src.filter(r => r.d >= a && r.d <= b);
  const cov = rows.length;
  const amt = rows.reduce((s,r) => s + r.amt, 0);
  const share = cov / SAMPLE_DAYS;
  const full = a === DATA_START && b === DATA_END;
  /* 主店用逐日真值。逐日求和会把跨日回访的同一访客重复计入，
     所以整段区间仍回去重聚合值，短区间用逐日累计并单独标口径。 */
  const isMain = src === DAILY;
  let uv, byr, basis;
  if (isMain && !full){
    const f = flowDaily(a, b);
    uv = f.uv; byr = f.byr; basis = 'daily';
  } else {
    uv = Math.round(AGG.uv.v * share);
    /* 金额为 0 的区间不可能有买家：折算出来的「日均买家」必须归零，
       否则单日 / 短区间会显示「¥0 · 买家 3」这种自相矛盾的组合。 */
    byr = amt > 0 ? Math.round(AGG.payByrCnt.v * share) : 0;
    basis = full ? 'agg' : 'est';
  }
  const aov = byr > 0 ? amt / byr : 0;
  const rate = uv > 0 ? byr / uv : 0;
  const zeroDays = rows.filter(r => r.amt === 0).length;
  const activeDays = cov - zeroDays;
  const peak = rows.reduce((m,r) => r.amt > m.amt ? r : m, {d:'—', amt:0});
  const spanDays = diffD(a,b) + 1;
  return {
    a, b, cov, spanDays, amt, byr, uv, aov, rate, share, basis,
    zeroDays, activeDays, peak,
    perDay: cov ? amt / cov : 0,
    full
  };
}

/* 折算系数与整段判断。
   约定：只有「事件计数类」指标（金额、访客、加购、收藏）允许按覆盖天数等比折算并标「折算」；
   比率、时长、渠道结构与单链接归因不折算，一律标「整段」。 */
function shareOf(a,b){ return (diffD(a,b) + 1) / SAMPLE_DAYS; }
function isFullSpan(a,b){ return a === DATA_START && b === DATA_END; }

/* 区间内的逐日访客 / 买家 / 商品访客真值求和。
   全部来自抓取数据，没有任何系数。同一访客跨日回访会被重复计入，
   所以它和整段的去重值不等，两者不能互相减，页面上分别标口径。 */
function flowDaily(a, b){
  let uv = 0, byr = 0, itmUv = 0;
  for (const r of DAILY_FLOW){
    if (r.d < a || r.d > b) continue;
    uv += r.uv; byr += r.byr; itmUv += r.itmUv;
  }
  return { uv, byr, itmUv };
}

/* ── 多店：确定性伪序列，保证每次打开图形一致 ─────────────────────────── */
function seedOf(str){
  let h = 2166136261;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 100000) / 100000;
}

/* 数据版本指纹。区间或总量一变，分店序列缓存自动失效，
   接入实时采集后不需要任何手动清缓存的代码。 */
const DATA_VERSION = DATA_START + '|' + DATA_END + '|' + AGG.payAmt.v;

function storeSeries(s){
  if (s.real) return DAILY;
  if (s._cache && s._cacheV === DATA_VERSION) return s._cache;
  const base = 3600 * s.ratio;
  const rows = DAILY.map((r, i) => {
    const n  = seedOf(s.id + r.d);
    const n2 = seedOf(s.id + r.d + 'b');
    let amt = Math.round(base * (0.35 + 1.5 * n) / 10) * 10;
    if (n2 < 0.12) amt = 0;
    if (i === 19 && s.ratio >= 0.4) amt += Math.round(26000 * s.ratio);
    return {d: r.d, amt};
  });
  /* 归一化：把随机波动后的合计拉回 108,000 × ratio。
     不归一化的话，交易页（本函数求和）、大屏店铺卡、商品页（ITEMS × ratio）、
     限额累计四处会各说各话（实测分店 4 差 10,250）。差值只摊到有成交的日子，
     不把 0 单日改成有单，避免凭空造出订单。 */
  const target = Math.round(108000 * s.ratio);
  const sum = rows.reduce((t, r) => t + r.amt, 0);
  const diff = target - sum;
  if (diff !== 0){
    const idx = rows.map((r, i) => (r.amt > 0 ? i : -1)).filter(i => i >= 0);
    const unit = diff > 0 ? 10 : -10;
    const left = Math.round(Math.abs(diff) / 10);
    const per = Math.floor(left / idx.length);
    const rem = left - per * idx.length;
    idx.forEach((i, k) => { rows[i].amt += unit * (per + (k < rem ? 1 : 0)); });
    /* 向下调整时若某天被压成负数，把它挪到当天金额最高的一天 */
    const neg = rows.find(r => r.amt < 0);
    if (neg){ const mx = rows.reduce((a, b) => (b.amt > a.amt ? b : a), rows[0]); mx.amt += neg.amt; neg.amt = 0; }
  }
  s._cache = rows; s._cacheV = DATA_VERSION;
  return rows;
}

function storeOf(id){ return STORES.find(x => x.id === id) || STORES[0]; }

/* 单店区间指标。主店走真实序列与真实环比，其余店为演示。
   主店必须显式传 DAILY：大屏会同时算五家店，用全局 SER 会读到当前高亮店的序列。 */
function metricsFor(s, a, b){
  if (s.real){
    const m = metrics(a, b, DAILY);
    return Object.assign(m, {crc: AGG.payAmt.c});
  }
  const rows = storeSeries(s).filter(r => r.d >= a && r.d <= b);
  const cov = rows.length;
  const amt = rows.reduce((t, r) => t + r.amt, 0);
  const uv  = Math.round(UV_BASE * s.ratio * cov / SAMPLE_DAYS);
  const byr = amt > 0 ? Math.round(BYR_BASE * s.ratio * cov / SAMPLE_DAYS) : 0;
  const zeroDays = rows.filter(r => r.amt === 0).length;
  const peak = rows.reduce((m, r) => r.amt > m.amt ? r : m, {d:'—', amt:0});
  return {
    a, b, cov, spanDays: diffD(a,b) + 1, amt, uv, byr,
    aov: byr ? amt / byr : 0,
    rate: uv ? byr / uv : 0,
    share: cov / SAMPLE_DAYS,
    zeroDays, activeDays: cov - zeroDays, peak,
    perDay: cov ? amt / cov : 0,
    full: false, basis: 'est', crc: s.crc
  };
}

/* 流量页的区间口径。这是本页此前最大的缺陷：时间条可点，但所有数字直读模块常量，
   区间变化只改了页头文字，数量链一处都没动。
   硬约束不变，只有支付金额有逐日序列，访客类没有逐日明细，只能按覆盖天数等比折算。
   三组处理方式，页面上逐块标注：
   · 折算组：全店访客、商品访客、PV、推荐 / 搜索 / 其他、渠道 UV、新老买家、内容访客
   · 整段组：跳失率、停留时长、人均浏览、渠道转化率与同行基准（比率与时长不随区间变）
   · 不随区间：地域 Top10（接口样本取自最近 1 天）、引流搜索词（30 天词表）
   「其他」取残差，保证 推荐 + 搜索 + 其他 恒等于折算后的全店访客。
   30 天整段时 share = 1，所有折算项与原值逐位相等，数字与改造前完全一致。 */
function flowMetrics(a, b){
  const m = metrics(a, b);
  const cov = m.cov, share = m.share, full = m.full;
  const uv = m.uv;
  /* 商品访客 / PV / 推荐 / 搜索都没有逐日序列，按「区间真实访客 ÷ 整段访客」
     的比例缩放，不再按天数等比。这样它们跟着真实访客一起波动，
     三项之和仍然恒等于全店访客。整段时比例 = 1，与接口原值逐位一致。 */
  const uvRatio = AGG.uv.v ? uv / AGG.uv.v : 0;
  const itmUv  = full ? AGG.itmUv.v : Math.round(AGG.itmUv.v * uvRatio);
  const pv     = full ? AGG.pv.v    : Math.round(AGG.pv.v * uvRatio);
  const rec    = Math.round(FLOW_SPLIT.rec * uvRatio);
  const search = Math.round(FLOW_SPLIT.search * uvRatio);
  const amt = m.amt;
  return {
    a, b, cov, share, amt, basis: m.basis, uvRatio,
    uv, itmUv, pv,
    rec, search, other: uv - rec - search,
    /* 比率与时长不折算 */
    bounceRate: AGG.bounceRate.v,
    stayTime: AGG.stayTime.v,
    itmAvgpv: AGG.itmAvgpv.v,
    /* 访客价值是派生比率，用区间真实支付金额 ÷ 区间真实访客。
       30 天时 108,000 ÷ 3,890 = 27.7635，与接口值逐位相等。 */
    uvValue: uv > 0 ? amt / uv : 0,
    full
  };
}

function bucketKey(d, g){
  if (g === 'day') return d;
  if (g === 'week'){
    const dt = D(d);
    const dow = (dt.getDay() + 6) % 7;
    dt.setDate(dt.getDate() - dow);
    return iso(dt);
  }
  if (g === 'month') return d.slice(0,7);
  return d.slice(0,4);
}
function bucketSpan(key, g){
  if (g === 'day') return 1;
  if (g === 'week') return 7;
  if (g === 'month') return daysInMonth(key);
  return 365;
}
function bucketLabel(key, g){
  if (g === 'day') return key.slice(5).replace('-','/');
  if (g === 'week') return key.slice(5).replace('-','/');
  if (g === 'month') return key.slice(2).replace('-','/');
  return key;
}
function bucketTitle(key, g){
  if (g === 'week') return key + ' 起 7 天';
  if (g === 'month') return key;
  if (g === 'year') return key + ' 年';
  return key;
}

/* 分桶。ser 显式传入时用传入的序列，不传才回落到全局 SER。
   大屏要五店口径的日期骨架，必须传 DAILY，不能靠全局 SER（那是当前高亮店）。 */
function buckets(a,b,g,ser){
  const src = ser || SER;
  const map = new Map();
  src.filter(r => r.d >= a && r.d <= b).forEach(r => {
    const k = bucketKey(r.d, g);
    if (!map.has(k)) map.set(k, {key:k, covered:0, amt:0});
    const o = map.get(k);
    o.covered++; o.amt += r.amt;
  });
  return [...map.values()]
    .sort((x,y) => x.key < y.key ? -1 : 1)
    .map(o => {
      const span = bucketSpan(o.key, g);
      return {...o, span, partial:o.covered < span, label:bucketLabel(o.key,g)};
    });
}

/* 月度限额 */
function quotaInfo(st, aEndMonth){
  const mKey = aEndMonth.slice(0,7);
  const inMonth = SER.filter(r => r.d.slice(0,7) === mKey);
  const cum = inMonth.reduce((s,r) => s + r.amt, 0);
  const quota = st.q;
  const ratio = cum / quota;
  const level = ratio > 1 ? 'over' : ratio >= 0.8 ? 'warn' : 'safe';
  const dim = daysInMonth(mKey);
  const lastDay = inMonth.length ? Number(inMonth[inMonth.length-1].d.slice(8)) : dim;
  const restDays = Math.max(0, dim - lastDay);
  const restBudget = Math.max(0, quota - cum);
  return {
    mKey, cum, quota, ratio, level, covered:inMonth.length, dim,
    restDays, restBudget,
    over: Math.max(0, cum - quota),
    perDayLeft: restDays > 0 ? restBudget / restDays : 0,
    perDayCum: inMonth.length ? cum / inMonth.length : 0
  };
}

/* 分店没有采集，切到分店时整页 KPI 一律强制标「演示」，避免出现「逐日/整段」这种真实口径。 */
let FORCE_DEMO = false;

const SRC = {
  exact: {t:'逐日', c:'exact', tip:'区间内逐日数据精确求和，未做任何折算'},
  cum:   {t:'逐日累计', c:'exact', tip:'按逐日抓取真值求和，未做任何折算。同一访客跨日回访会重复计数，与整段去重值不等'},
  agg:   {t:'整段去重', c:'fixed', tip:'接口返回的 30 天去重聚合值，未做任何折算'},
  est:   {t:'折算', c:'est',   tip:'分店无逐日序列，按覆盖天数等比折算，仅供参考'},
  ratio: {t:'推算', c:'est',   tip:'该指标只有 30 天聚合值，按区间真实访客占比缩放，结构可信、绝对值仅供参考'},
  fixed: {t:'整段', c:'fixed', tip:'接口只提供 30 天整段值，不随区间变化'},
  demo:  {t:'演示', c:'demo',  tip:'该指标尚未接入采集，当前为版式演示值'}
};
/* basis → 徽标键。主店短区间是逐日累计，整段是去重聚合，分店是折算。 */
const BASIS_SRC = { daily:'cum', agg:'agg', est:'est' };

function kpiCard(o){
  const k = o.src ? (FORCE_DEMO ? 'demo' : o.src) : null;
  const src = k ? `<span class="src ${SRC[k].c}" data-tip="${SRC[k].tip}">${SRC[k].t}</span>` : '';
  const clickable = o.go || o.drawer;
  const attr = o.go ? `data-go="${o.go}"` : o.drawer ? `data-drawer="${o.drawer}"` : '';
  return `<div class="card kpi${clickable?' kpi-click':''}" ${attr}>
    <div class="kpi-label">${o.label}${o.note?`<span class="tip">${o.note}</span>`:''}${src}</div>
    <div class="kpi-value">${o.value}</div>
    ${o.delta != null
      ? `<div class="kpi-delta"><span class="pill ${cls(o.delta)}">${arrow(o.delta)} ${signed(o.delta)}</span><span class="mono-weak" style="font-size:11px">${o.deltaLabel||'较前 30 天'}</span></div>`
      : `<div class="kpi-sub">${o.sub||''}</div>`}
    ${clickable?`<div class="kpi-go">${o.hint||'查看明细'} ›</div>`:''}
  </div>`;
}

function chartBlock(bsA, bsB, g, legend){
  const vals = bsA.map(b => b.amt).concat((bsB||[]).map(b => b.amt));
  const max = Math.max(1, ...vals);
  const n = Math.max(bsA.length, (bsB||[]).length);
  const step = Math.max(1, Math.ceil(n / 7));
  const showLast = ((n-1) % step) >= Math.max(2, Math.ceil(step/2));

  let bars = '';
  for (let i = 0; i < n; i++){
    const A = bsA[i], B = (bsB||[])[i];
    const tip = A ? `<b>${bucketTitle(A.key,g)}</b><br>${A.partial?`<em>部分覆盖 ${A.covered}/${A.span} 天</em><br>`:''}A ${money(A.amt)}` : '';
    const tipB = bsB && B ? `<br>B ${money(B.amt)}` : '';
    const hA = A ? (A.amt === 0 ? 1.2 : Math.max(3, A.amt / max * 100)) : 0;
    const hB = bsB && B ? (B.amt === 0 ? 1.2 : Math.max(3, B.amt / max * 100)) : 0;
    bars += `<div class="bgroup" ${A?`data-bucket="${A.key}"`:''} data-tip="${esc(tip+tipB)}">
      ${bsB ? (B?`<div class="bar b" style="height:${hB}%"></div>`:'<div class="bar b" style="height:1.2%"></div>') : ''}
      ${A ? `<div class="bar ${A.amt===0?'zero':A.amt===max?'peak':''} ${A.partial?'partial':''}" style="height:${hA}%"></div>` : ''}
    </div>`;
  }
  let xs = '';
  for (let i = 0; i < n; i++){
    const A = bsA[i];
    xs += `<span>${A && (i % step === 0 || (showLast && i === n-1)) ? A.label : ''}</span>`;
  }
  return `<div class="chart">${bars}</div><div class="chart-x">${xs}</div>
    <div class="legend">${legend||''}</div>`;
}

function timeBar(st, simple, note){

  return `<div class="timebar">
    <div class="tb-item"><span class="tb-label">区间</span>
      ${seg([['d1','单日'],['7d','近 7 天'],['30d','近 30 天'],['tm','本月'],['lm','上月'],['custom','自定义']], st.p, 'p')}
    </div>
    <div class="tb-item">
      <input class="date-in" type="date" value="${st.a[0]}" min="${DATA_START}" max="${DATA_END}" data-date="a1" />
      <span class="tb-label">至</span>
      <input class="date-in" type="date" value="${st.a[1]}" min="${DATA_START}" max="${DATA_END}" data-date="a2" />
    </div>
    <div class="tb-item"><span class="tb-label">维度</span>
      ${seg([['day','日'],['week','周'],['month','月'],['year','年']], st.g, 'g')}
    </div>
    ${simple ? '' : `<div class="tb-item">
      <button class="tb-btn" data-set="cmp=${st.cmp?0:1}" aria-pressed="${st.cmp}">
        ${st.cmp?'✓ ':''}对比模式
      </button>
    </div>`}
    ${!simple && st.cmp ? (st.b ? `<div class="tb-item"><span class="tb-label">对比 B</span>
      <input class="date-in" type="date" value="${st.b[0]}" min="${DATA_START}" max="${DATA_END}" data-date="b1" />
      <span class="tb-label">至</span>
      <input class="date-in" type="date" value="${st.b[1]}" min="${DATA_START}" max="${DATA_END}" data-date="b2" />
    </div>` : `<div class="tb-item"><span class="tb-label">对比 B</span>
      <span class="tb-warn" style="margin:0">A 之前没有等长历史，请手动选 B 区间</span>
    </div>`) : ''}
    ${clamped ? `<span class="tb-warn">上月已截取到数据范围（仅 09-19 起有数）</span>` : ''}
    ${single && !storeOf(st.s).real ? `<span class="tb-warn">单日：该店未采集，买家 / 访客按 30 天日均折算（演示值）</span>` : ''}
    <span class="tb-note">${note || `数据范围 ${DATA_START} ～ ${DATA_END}（${SAMPLE_DAYS} 天）`}</span>
  </div>`;
}

/* 服务体验页的「快照条」，替代时间条。
   响应率 / 待回复 / 待答属于「当前状态」类指标，没有区间概念。给一个能点、
   点了又什么都不变的时间条，用户会以为刷新失效（这正是本轮要修的异常之一）。
   这里只说明数据覆盖与口径，不放任何可点控件。 */
function snapshotBar(note){
  return `<div class="timebar">
    <div class="tb-item"><span class="tb-label">口径</span><span style="font-size:12px">30 天整段快照</span></div>
    <div class="tb-item"><span class="tb-label">覆盖</span><span style="font-size:12px">${DATA_START} ～ ${DATA_END}</span></div>
    <span class="tb-note">${note || '响应率 / 待回复 / 待答是「当前状态」类指标，不按区间聚合，故本页不提供区间选择'}</span>
  </div>`;
}

/* 店铺切换（业务分析页通用，放在页头右侧）。切完 URL 上的 s 变，整页按该店重算。 */
function storeSeg(st){
  return `<div class="store-seg">
    <span class="tb-label">店铺</span>
    <div class="seg">${STORES.map(s =>
      `<button role="tab" aria-selected="${st.s===s.id}" data-set="s=${s.id}"
        data-tip="${esc(s.name)}${s.real?' · 真实采集':' · 演示数据'}">${esc(s.short)}${s.real?'':'<i class="dim"></i>'}</button>`
    ).join('')}</div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════════════
   页面：交易分析
   ══════════════════════════════════════════════════════════════════════════ */
function pageTrade(st){
  const curS = storeOf(st.s);
  const A = metrics(st.a[0], st.a[1]);
  /* st.b 为 null 表示 A 之前没有等长历史，此时不做对比，页面上显式说明原因。 */
  const B = st.b ? metrics(st.b[0], st.b[1]) : null;
  const q = quotaInfo(st, st.a[1]);
  const bsA = buckets(st.a[0], st.a[1], st.g);
  const bsB = st.cmp && st.b ? buckets(st.b[0], st.b[1], st.g) : null;

  const alert = q.level === 'over' ? `
    <div class="alert">
      <span class="a-badge">超额</span>
      <span>${q.mKey.replace('-',' 年 ')} 月累计支付金额 <b>${money(q.cum)}</b>，已超过限额 <b>${money(q.quota)}</b>，超出 <b>${money(q.over)}</b>（${pct(q.ratio,1)}）。注意排产与交付节奏。</span>
      <span class="a-go" data-drawer="quota">看累计明细 ›</span>
    </div>` : '';

  const kpis = [
    kpiCard({
      label:'店铺交易金额', src:'exact', value:'<small>¥</small>' + nf(A.amt),
      delta: A.full ? AGG.payAmt.c : null,
      sub: A.full ? '生意参谋口径 = 支付金额' : `区间日均 <b>${money(A.perDay)}</b> · 有成交 ${A.activeDays} 天`,
      go:'#/items?g=' + st.g + '&p=' + st.p + '&a1=' + st.a[0] + '&a2=' + st.a[1] + '&cmp=0&q=' + st.q,
      hint:'看商品构成'
    }),
    kpiCard({
      label:'支付买家数', src: BASIS_SRC[A.basis], value:nf(A.byr),
      delta: A.full ? AGG.payByrCnt.c : null,
      sub: A.basis === 'daily' ? `逐日真值求和，覆盖 ${A.cov} 天 · 同一买家跨日重复计数`
         : A.basis === 'est'   ? `分店无逐日序列，按覆盖 ${A.cov} 天等比折算`
         : '30 天接口去重值',
      go:'#/flow?g=' + st.g + '&p=' + st.p + '&a1=' + st.a[0] + '&a2=' + st.a[1] + '&cmp=0&q=' + st.q,
      hint:'看买家来源'
    }),
    kpiCard({
      label:'客单价', src: BASIS_SRC[A.basis], value:'<small>¥</small>' + A.aov.toLocaleString('zh-CN',{minimumFractionDigits:1,maximumFractionDigits:1}),
      delta: A.full ? AGG.payPct.c : null,
      sub: A.full ? '' : '= 支付金额 ÷ 支付买家数'
    }),
    kpiCard({
      label:'访客数', src: BASIS_SRC[A.basis], value:nf(A.uv),
      delta: A.full ? AGG.uv.c : null,
      sub: A.basis === 'daily' ? `逐日真值求和，覆盖 ${A.cov} 天 · 同一访客跨日重复计数`
         : A.basis === 'est'   ? `分店无逐日序列，按覆盖 ${A.cov} 天等比折算`
         : '30 天接口去重值',
      go:'#/flow?g=' + st.g + '&p=' + st.p + '&a1=' + st.a[0] + '&a2=' + st.a[1] + '&cmp=0&q=' + st.q,
      hint:'看流量渠道'
    }),
    kpiCard({
      label:'支付转化率', src: BASIS_SRC[A.basis], value:pct(A.rate),
      delta: A.full ? AGG.payRate.c : null,
      sub: A.full ? '' : '= 支付买家数 ÷ 访客数',
      go:'#/items?g=' + st.g + '&p=' + st.p + '&a1=' + st.a[0] + '&a2=' + st.a[1] + '&cmp=0&q=' + st.q,
      hint:'看链接转化'
    }),
    kpiCard({
      label:'退款金额', src:'fixed', value:'<small>¥</small>' + nf(REFUND.amt),
      sub:`金额退款率 ${pct(REFUND.amtRate)} · 主因 ${REFUND.reason}`,
      drawer:'refund', hint:'看退款明细'
    })
  ].join('');

  const dB = defaultB(st.a);
  const bIsDefault = !!(st.b && dB && st.b[0] === dB[0] && st.b[1] === dB[1]);

  const compareCard = st.cmp && B ? (() => {
    const rows = [
      {k:'支付金额',  a:money(A.amt),        b:money(B.amt),        d:money(A.amt-B.amt),     r:(B.amt?A.amt/B.amt-1:0), t:'money'},
      {k:'区间天数',  a:A.cov + ' 天',        b:B.cov + ' 天',        d:(A.cov-B.cov) + ' 天',  r:null, t:'num'},
      {k:'日均金额',  a:money(A.perDay),      b:money(B.perDay),      d:money(A.perDay-B.perDay), r:(B.perDay?A.perDay/B.perDay-1:0), t:'money'},
      {k:'支付买家数',a:nf(A.byr),           b:nf(B.byr),            d:(A.byr-B.byr>=0?'+':'')+(A.byr-B.byr), r:(B.byr?A.byr/B.byr-1:0), t:'num'},
      {k:'客单价',    a:money1(A.aov),        b:money1(B.aov),        d:money1(A.aov-B.aov),    r:(B.aov?A.aov/B.aov-1:0), t:'money'},
      {k:'访客数',    a:nf(A.uv),             b:nf(B.uv),             d:(A.uv-B.uv>=0?'+':'')+(A.uv-B.uv), r:(B.uv?A.uv/B.uv-1:0), t:'num'},
      {k:'转化率',    a:pct(A.rate),          b:pct(B.rate),          d:((A.rate-B.rate)*100).toFixed(2)+' pp', r:(B.rate?A.rate/B.rate-1:0), t:'pct'},
      {k:'零成交天数',a:A.zeroDays+' 天',      b:B.zeroDays+' 天',      d:(A.zeroDays-B.zeroDays)+' 天', r:null, t:'num'}
    ];
    return `<div class="card" style="margin-top:12px">
      <div class="card-head">
        <div class="card-title">区间对比</div>
        <div class="card-note">A / B 并列 · 差异 = A − B</div>
      </div>
      <div class="cmp-hero">
        <div class="side left">
          <span><i class="tagA">A</i>${A.a} ～ ${A.b}</span>
          <b>${money(A.amt)}</b><em>${A.cov} 天 · 日均 ${money(A.perDay)}</em>
        </div>
        <div class="vs">
          <span class="pill ${cls(A.perDay-B.perDay)}">${arrow(A.perDay-B.perDay)} ${B.perDay?signed(A.perDay/B.perDay-1):'—'}</span>
          <span style="font-size:10px;color:var(--muted-foreground-weak)">日均对比</span>
        </div>
        <div class="side right">
          <span><i class="tagB">B</i>${B.a} ～ ${B.b}</span>
          <b>${money(B.amt)}</b><em>${B.cov} 天 · 日均 ${money(B.perDay)}</em>
        </div>
      </div>
      ${bIsDefault ? `<div style="padding:0 18px 10px;text-align:center;font-size:11.5px;color:var(--muted-foreground-weak)">
        B 默认取 A 之前紧邻的等长区间（不与 A 重叠）。要换基准，改上方「对比 B」的两个日期即可。
      </div>` : ''}
      <div class="card-body" style="padding-top:12px">
        <div class="table-wrap">
          <table>
            <thead><tr><th>指标</th><th>A 区间</th><th>B 区间</th><th>差异</th><th>变化</th></tr></thead>
            <tbody>${rows.map(r => `<tr style="cursor:default">
              <td>${r.k}</td>
              <td>${r.a}</td>
              <td class="mono-weak">${r.b}</td>
              <td>${r.d}</td>
              <td>${r.r==null?'<span class="mono-weak">—</span>':`<span class="pill ${cls(r.r)}">${arrow(r.r)} ${signed(r.r)}</span>`}</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
        ${A.a === B.a && A.b === B.b ? '<div class="kpi-foot">A 与 B 区间完全重合，差异恒为 0。改一下 B 的起止日期即可。</div>' : ''}
      </div>
    </div>`;
  })() : st.cmp ? `<div class="card" style="margin-top:12px">
      <div class="card-body" style="display:flex;align-items:center;gap:12px;padding:16px 18px">
        <div style="font-size:13px;color:var(--muted-foreground)">
          A 区间之前没有等长历史（数据从 ${DATA_START} 开始），无法自动取对比基线。请在上方「对比 B」里手动选两个日期。
        </div>
      </div>
    </div>` : `<div class="card" style="margin-top:12px">
      <div class="card-body" style="display:flex;align-items:center;gap:12px;padding:16px 18px">
        <div style="font-size:13px;color:var(--muted-foreground)">
          打开对比模式，可把任意两个区间（或两种维度）的数据并列摆在一起看。
        </div>
        <button class="tb-btn" style="margin-left:auto" data-set="cmp=1">开启对比</button>
      </div>
    </div>`;

  const bucketRows = bsA.map((b,i) => {
    const prev = bsA[i-1];
    const crc = prev && prev.amt > 0 ? (b.amt/prev.amt - 1) : null;
    return `<tr data-bucket="${b.key}">
      <td>${bucketTitle(b.key, st.g)}${b.partial?`<span class="zero-tag" style="color:var(--muted-foreground-weak);margin-left:6px">部分 ${b.covered}/${b.span} 天</span>`:''}</td>
      <td>${b.covered} 天</td>
      <td>${b.amt?money(b.amt):'<span class="mono-weak">—</span>'}</td>
      <td>${A.amt?(b.amt/A.amt*100).toFixed(1)+'%':'—'}</td>
      <td>${b.covered?money(b.amt/b.covered):'—'}</td>
      <td>${crc==null?'<span class="mono-weak">—</span>':`<span class="pill ${cls(crc)}">${arrow(crc)} ${signed(crc)}</span>`}</td>
    </tr>`;
  }).join('');

  return `
    <div class="page-head">
      <div>
        <h1 class="page-title">交易分析</h1>
        <div class="page-sub">
          ${esc(storeOf(st.s).name)}${storeOf(st.s).real?'':'（演示）'}
          <span class="sep">|</span>${st.a[0]} ～ ${st.a[1]}（${A.cov} 天）
          <span class="sep">|</span>按${GRAN[st.g]}查看${st.cmp && st.b ? ' · 对比 B 区间 '+st.b[0]+' ～ '+st.b[1] : st.cmp ? ' · 对比模式（无可比基线）' : ''}
        </div>
      </div>
      ${storeSeg(st)}
    </div>
    ${timeBar(st)}
    ${st.g === 'year'
      ? `<div class="kpi-foot" style="margin:-4px 0 12px">年维度下目前只有 2026 一年数据（覆盖 ${A.cov} 天），趋势图只会出现 1 根柱。年度对比要等积累到第二年才有意义。</div>`
      : st.g === 'month'
      ? `<div class="kpi-foot" style="margin:-4px 0 12px">月维度下 2026-09 只覆盖 12 天、2026-10 只覆盖 18 天，两根柱都不代表完整月份，图上用斜纹标出。</div>`
      : ''}
    ${alert}
    <div class="kpi-grid">${kpis}</div>
    <div class="kpi-foot">「逐日」= 区间内逐日抓取真值求和；「逐日累计」= 同样按逐日真值求和，但同一访客或买家跨日回访会重复计数；「整段去重」= 接口返回的 30 天去重值；「折算」仅用于未采集的分店。涨红跌绿只表示变化方向，不表示好坏。</div>

    <div class="split">
      <div class="card chart-card">
        <div class="card-head">
          <div class="card-title">支付金额 · 按${GRAN[st.g]}</div>
          <div class="card-note">峰值 ${A.peak.d.slice(5)} 单日占 ${pct(A.peak.amt / (A.amt||1),1)} · 点击柱子看明细</div>
        </div>
        <div class="chart-box">
          ${chartBlock(bsA, bsB, st.g,
            `<span><i style="background:var(--m-neutral)"></i>${st.cmp && bsB ? 'A 区间' : '单'+GRAN[st.g]+'金额'}</span>
             ${st.cmp && bsB ? '<span><i style="background:color-mix(in srgb,var(--m-blue) 45%,var(--card))"></i>B 区间</span>' : ''}
             <span><i style="background:var(--border)"></i>零成交</span>
             ${st.g==='day' ? '' : `<span><i class="hatch"></i>斜纹 = 该${GRAN[st.g]}数据只覆盖部分天数</span>`}`)}
        </div>
      </div>

      <div class="card quota-card">
        <div class="card-head" style="padding:0">
          <div class="card-title">月度金额限额</div>
          <div class="card-note">${q.mKey} 月 · 已过 ${q.covered} / ${q.dim} 天</div>
        </div>
        <div class="quota-top" style="margin-top:15px">
          <div class="quota-big"><small>¥</small>${nf(q.cum)}</div>
          <div class="quota-cap">限额 ${money(q.quota)}</div>
        </div>
        <div class="prog ${q.level==='over'?'over':q.level==='warn'?'warn':''}" data-tip="本月已累计 ${money(q.cum)}，占限额 ${pct(q.ratio,1)}">
          <i style="width:${Math.min(100, q.ratio*100).toFixed(1)}%"></i>
          <span class="tick warn" style="left:80%"></span>
          <span class="tick" style="left:100%;transform:translateX(-2px)"></span>
          <span class="cap" style="left:80%;transform:translateX(-100%);padding-right:5px">80% 预警</span>
          <span class="cap" style="left:100%;transform:translateX(-100%)">限额</span>
        </div>

        <div class="quota-legend">
          <span class="quota-state ${q.level}">
            ${q.level==='over' ? `已超额 ${pct(q.ratio-1,1)}` : q.level==='warn' ? `触及预警线` : `额度充裕`}
          </span>
          <span>本月日均 <b>${money(q.perDayCum)}</b></span>
        </div>
        <div class="quota-legend" style="margin-top:6px">
          <span>${q.level==='over' ? `已超额 <b class="warn">${money(q.over)}</b>` : `剩余额度 <b>${money(q.restBudget)}</b>`}</span>
          <span>${q.level==='over' ? `剩 ${q.restDays} 天 · 额度已用尽` : `剩 ${q.restDays} 天 · 日均可用 <b>${money(q.perDayLeft)}</b>`}</span>
        </div>

        <div class="quota-edit">
          <div class="quota-row">
            <span class="tb-label">限额</span>
            <input class="date-in" type="number" min="1000" step="1000" value="${q.quota}" data-quota />
            <span class="tb-label" style="font-size:11px">改完回车生效</span>
          </div>
          <div class="quota-row">
            <span class="tb-label">快捷</span>
            <div class="quota-preset">
              ${[50000,80000,100000,150000].map(v => `<button class="tb-btn" data-set="q=${v}" ${v===q.quota?'aria-pressed="true"':''}>${v/10000} 万</button>`).join('')}
            </div>
          </div>
        </div>
        <div class="kpi-foot" style="margin-top:11px">
          按月累计支付金额，超过即提示。示例值 ¥80,000，可改成自己的产能红线或预算上限，改完会写进地址栏，便于分享同一口径。
        </div>
      </div>
    </div>

    ${compareCard}

    <div class="card" style="margin-top:12px">
      <div class="card-head">
        <div class="card-title">${GRAN[st.g]}明细</div>
        <div class="card-note">${bsA.length} 个${GRAN[st.g]} · 点击行看细节</div>
      </div>
      <div class="card-body">
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>${GRAN[st.g]}期</th><th>覆盖天数</th><th>支付金额</th><th>占区间</th><th>日均</th><th>环比上期</th>
            </tr></thead>
            <tbody>${bucketRows}</tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="split even">
      <div class="card">
        <div class="card-head"><div class="card-title">退款与售后</div><div class="card-note">近 30 天整段</div></div>
        <div class="card-body">
          <div class="mini-grid" style="grid-template-columns:repeat(2,1fr)">
            <div class="mini" data-drawer="refund"><span>成功退款金额</span><b>${money(REFUND.amt)}<em class="mono-weak">${pct(REFUND.amtRate)} 占比</em></b></div>
            <div class="mini" data-drawer="refund"><span>退款订单 / 买家</span><b>${REFUND.ord} / ${REFUND.byr}<em class="mono-weak">订单退款率 ${pct(REFUND.ordRate)}</em></b></div>
          </div>
          <div class="diag" style="margin-top:12px">
            <span class="badge">退款原因</span>
            <p>全部 ${REFUND.ord} 笔退款来自「<b>${REFUND.reason}</b>」（${REFUND.reasonType}）。金额小、笔数少，售后不是当前的主要问题，重点仍在转化。</p>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><div class="card-title">口径说明</div><div class="card-note">为什么有些数字不跟着区间变</div></div>
        <div class="card-body">
          <div class="dnote">
            生意参谋只对「支付金额」提供逐日序列。访客、买家、转化率、跳失率、退款、地域、搜索词都是接口算好的 <b>30 天整段值</b>，换成 7 天区间没法重新切分。<br><br>
            本页的处理：支付金额走逐日精确求和；买家数与访客数按覆盖天数等比折算并标「折算」；其余标「整段」且不参与区间重算。<br><br>
            要彻底解决，需要在采集端按天落库（每天存一份），代码阶段再做。

let itemSort = {key:'uv', dir:-1};

/* 商品页的区间视图。列表、零成交卡、单品抽屉三处共用这一份，避免各自取整出现差异。
   金额与加购按「区间真实支付金额」的占比缩放，不按天数等比。
   支付金额是全店唯一有逐日序列的指标，交易页取逐日真值；若这里按天数等比，
   近 7 天会得出 ¥25,200 而交易页是 ¥13,500，两页对不上（实测差 11,700）。
   按真值占比分配后合计恒等于交易页，单链接之间保持 30 天结构。
   访客 / 买家 / 收藏是计数类，仍按天数等比，与交易页、流量页口径一致。 */
function itemView(a, b){
  const m   = metrics(a, b);
  const sh  = m.share;
  const amtScale = AGG.payAmt.v ? m.amt / AGG.payAmt.v : sh;
  /* 计数类按「区间真实访客 ÷ 整段访客」缩放，与交易页、流量页同源。
     整段时比例 = 1，数字与 30 天原值逐位一致。 */
  const countScale = AGG.uv.v ? m.uv / AGG.uv.v : sh;
  const k   = v => Math.round(v * countScale);
  const rows = ITEMS.map(x => ({...x,
    uv:k(x.uv), byr:k(x.byr), clt:k(x.clt),
    amt: Math.round(x.amt * amtScale), cart: Math.round(x.cart * amtScale)}));

  /* 逐条四舍五入会累积误差（近 7 天实测合计比交易页多 1 元）。
     把残差摊到金额最大的那条链接上，保证合计与交易页逐元相等。 */
  const sum = rows.reduce((s,x) => s + x.amt, 0);
  if (sum !== m.amt && rows.length){
    const big = rows.reduce((p,q) => q.amt > p.amt ? q : p, rows[0]);
    big.amt += m.amt - sum;
  }
  return { sh, m, amtScale, rows };
}

/* ══════════════════════════════════════════════════════════════════════════
   页面：数据大屏（跨店总览，收在壳内，浅色）
   ══════════════════════════════════════════════════════════════════════════ */
const STORE_COLORS = ['#52525b','#185fa5','#0f6e56','#534ab7','#854f0b'];

function storeBuckets(s, a, b, g){
  const m = new Map();
  storeSeries(s).filter(r => r.d >= a && r.d <= b).forEach(r => {
    const k = bucketKey(r.d, g);
    m.set(k, (m.get(k) || 0) + r.amt);
  });
  return m;
}

/* 大屏折线图的数据。金额来自 DAILY，访客与买家来自 DAILY_FLOW，
   按同一个 bucketKey 对齐到桶里；转化率是桶内 买家 ÷ 访客。
   两条序列逐日一一对应，所以桶的集合也一致。 */
/* 分店没有逐日真值，按倍率缩放时会栽在取整上：
   买家每天只有 0～7 人，逐日 round(4 × 0.09) = 0，30 天累加只剩 1 人，
   而 92 × 0.09 应该是 8 人（实测分店 5 就是这样掉到 1 人）。
   改用最大余数法：先按比例摊成小数并取整，剩下的几个单位按小数部分
   从大到小补回去，保证合计等于 round(总量 × 倍率)。 */
function scaleAlloc(values, ratio){
  const raw  = values.map(v => v * ratio);
  const base = raw.map(v => Math.floor(v));
  let left = Math.round(raw.reduce((t,v) => t + v, 0)) - base.reduce((t,v) => t + v, 0);
  const order = raw.map((v,i) => ({i, frac: v - Math.floor(v)})).sort((x,y) => y.frac - x.frac);
  const out = base.slice();
  for (let k = 0; k < order.length && left > 0; k++, left--) out[order[k].i] += 1;
  return out;
}

function trendRows(a, b, g, store){
  /* 必须显式接店铺。此前这里直接遍历 DAILY / DAILY_FLOW（都是主店常量），
     调用处也没传店铺，于是切店后曲线一条不动，属于数据绑定漏了参数，
     与监听、缓存都无关。
     金额走该店自己的日序列（storeSeries：主店真实、分店生成）；
     访客与买家只有主店有逐日真值，分店按倍率缩放，转换率因此不随倍率变。 */
  const s = store || storeOf('main');
  const ratio = s.real ? 1 : s.ratio;
  const map = new Map();
  const get = k => {
    if (!map.has(k)) map.set(k, {key:k, amt:0, uv:0, byr:0});
    return map.get(k);
  };
  for (const r of storeSeries(s)){
    if (r.d < a || r.d > b) continue;
    get(bucketKey(r.d, g)).amt += r.amt;
  }
  const days = DAILY_FLOW.filter(r => r.d >= a && r.d <= b);
  const uvVals  = s.real ? days.map(r => r.uv)  : scaleAlloc(days.map(r => r.uv),  ratio);
  const byrVals = s.real ? days.map(r => r.byr) : scaleAlloc(days.map(r => r.byr), ratio);
  days.forEach((r, i) => {
    const o = get(bucketKey(r.d, g));
    o.uv += uvVals[i];
    o.byr += byrVals[i];
  });
  return [...map.values()]
    .sort((x,y) => x.key < y.key ? -1 : 1)
    .map(o => ({...o, rate: o.uv ? o.byr / o.uv : 0,
                label: bucketLabel(o.key, g), title: bucketTitle(o.key, g)}));
}

/* 四指标折线图。四条曲线量级差得远（金额四位数、转化率个位数），
   放进同一个坐标轴必然有三条贴底，所以每条按自身区间峰值归一。
   归一化只用于比趋势与拐点，绝对高低靠图例下方的区间合计与悬停提示。 */
function lineChartSVG(rows, on){
  const n = rows.length;
  /* 单日只有一个点，用整行高度画会留下大片空白，压缩到 140 */
  const W = 1000, H = n <= 1 ? 140 : 250, padL = 12, padR = 12, padT = 16, padB = 28;
  const pw = W - padL - padR, ph = H - padT - padB;
  if (!n) return '<div class="chart-foot">当前区间没有可画的数据点。</div>';
  const xAt = i => n <= 1 ? padL + pw / 2 : padL + i * (pw / (n - 1));
  const yAt = (v, top) => padT + ph * (1 - (top > 0 ? Math.min(1, v / top) : 0));

  let grid = '';
  for (let k = 0; k <= 4; k++){
    const y = padT + ph * k / 4;
    grid += `<line class="grid" x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}"/>`;
  }

  const shown = SCREEN_SERIES.filter(s => on.includes(s.k));
  let paths = '';
  for (const s of shown){
    const max = Math.max(0, ...rows.map(r => r[s.k]));
    const top = max > 0 ? max * 1.08 : 1;
    if (n === 1){
      paths += `<circle class="dot" cx="${xAt(0).toFixed(1)}" cy="${yAt(rows[0][s.k], top).toFixed(1)}" r="3.2" fill="${s.color}"/>`;
      continue;
    }
    paths += `<polyline class="line" points="${rows.map((r,i) => xAt(i).toFixed(1) + ',' + yAt(r[s.k], top).toFixed(1)).join(' ')}" stroke="${s.color}"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/>`;
    if (n <= 31){
      paths += rows.map((r,i) =>
        `<circle class="dot" cx="${xAt(i).toFixed(1)}" cy="${yAt(r[s.k], top).toFixed(1)}" r="2.3" fill="${s.color}"/>`).join('');
    }
  }

  /* 悬停热区：等宽矩形铺满绘图区，复用全局 data-tip 处理器 */
  const slot = n <= 1 ? pw : pw / (n - 1);
  let hits = '';
  rows.forEach((r, i) => {
    const cx = xAt(i);
    const x0 = Math.max(padL, cx - slot / 2);
    const x1 = Math.min(W - padR, cx + slot / 2);
    const tip = `<b>${r.title}</b>` +
      (shown.length ? shown.map(s => `<br>${s.name} ${s.fmt(r[s.k])}`).join('') : '<br>未选择指标');
    hits += `<rect class="hit" x="${x0.toFixed(1)}" y="${padT}" width="${Math.max(1, x1 - x0).toFixed(1)}" height="${ph}" data-tip="${esc(tip)}"/>`;
  });

  const step = Math.max(1, Math.ceil(n / 14));
  let xs = '';
  rows.forEach((r, i) => {
    if (i % step === 0 || i === n - 1)
      xs += `<text class="axis-x" x="${xAt(i).toFixed(1)}" y="${H - 7}" text-anchor="middle">${r.label}</text>`;
  });

  if (n === 1){
    xs += `<text class="axis-x" x="${xAt(0).toFixed(1)}" y="${(padT + ph / 2 + 20).toFixed(1)}" text-anchor="middle" style="fill:var(--muted-foreground-weak)">单日只有一个数据点，切到「近 7 天」或「近 30 天」可看趋势</text>`;
  }

  return `<svg class="line-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="四指标趋势">`
    + grid + paths + hits + xs + `</svg>`;
}

function pageOverview(st){

  const totalAmt = list.reduce((t,x) => t + x.m.amt, 0);
  const totalByr = list.reduce((t,x) => t + x.m.byr, 0);
  const totalUv  = list.reduce((t,x) => t + x.m.uv, 0);
  const realAmt  = list.filter(x => x.s.real).reduce((t,x) => t + x.m.amt, 0);

  /* 环比是「30 天区间对 30 天区间」，短区间下没有可比对象，不显示数字，避免被当成日环比 */

        <span${s.real?'':' data-tip="分店按主店结构等比缩放，买家与访客同倍率，所以转化率不随倍率变化（不是切店没生效）"'}>转化 <b>${pct(m.rate)}</b></span>
      </div>
      <div class="store-foot">
        ${crcCell(m)}
        ${spark(s)}
      </div>
    </div>`).join('');

  /* 风险条 5 项目前只有主店采集，切到分店时数值不变。
     必须挂「主店」作用域小标，否则用户会把它当成当前聚焦店的数据。 */
  const riskItems = [
    {icon:'!',  label:'全部违规',       scope:'主店', val:HEALTH.violation + ' 条', lv:HEALTH.violation > 0 ? 'bad' : 'ok', go:navHref(st,'items')},
    {icon:'▤',  label:'素材过期或缺失', scope:'主店', val:(HEALTH.materialExpired + HEALTH.materialIncomplete) + ' 个', lv:'warn', go:navHref(st,'items')},
    {icon:'☆',  label:'评价待回复',     scope:'主店', val:SERVICE.rateUnreplied + ' 条', lv:'bad', go:navHref(st,'service')},
    {icon:'?',  label:'问大家待答',     scope:'主店', val:SERVICE.wendaPending + ' 条', lv:'warn', go:navHref(st,'service')},
    {icon:'¥',  label:'万象台余额',     scope:'主店', val:money(ADS.wxtBalance), lv:'ok', go:navHref(st,'ads')}
  ];
  const risks = riskItems.map(r => `
    <div class="risk ${r.lv}" data-go="${r.go}">
      <span class="ri">${r.icon}</span>
      <span class="rt">${r.scope?`<em class="scope-tag">${r.scope}</em>`:''}${r.label}<b class="rv">${r.val}</b></span>
    </div>`).join('');

  /* 折线图数据与图例。原「五店合计堆叠」已移到抽屉（openStackTrend），
     这个位置让给四指标趋势，跟随当前店铺切换。跨店合计仍由上方五店卡与对比表承担。 */
  const tRows = trendRows(st.a[0], st.a[1], st.g, cur);
  const lsOn  = st.ls || LS_ALL;
  const lgBtns = SCREEN_SERIES.map(s => {
    const isOn = lsOn.includes(s.k);
    const next = isOn ? lsOn.filter(k => k !== s.k) : LS_ALL.filter(k => lsOn.includes(k) || k === s.k);
    return `<button class="lg-item${isOn ? ' on' : ''}" data-set="ls=${next.join(',')}" aria-pressed="${isOn}"
      data-tip="${isOn ? '点击隐藏' : '点击显示'}${s.name}">
      <i style="background:${s.color}"></i><span>${s.name}</span><b class="cb">✓</b></button>`;
  }).join('');
  /* 页脚合计必须走 metrics()，不能拿 tRows 求和。
     tRows 是逐日累计，整段时访客 4,038 买家 92，算出的转化率 2.28%；
     而五店卡用去重值 3,890 / 91，是 2.34%。同一屏两处不一致会很扎眼。 */
  const tM    = metricsFor(cur, st.a[0], st.a[1]);
  const tAmt  = tM.amt, tUv = tM.uv, tByr = tM.byr, tRate = tM.rate;

  /* 模块入口卡：大屏是五店总览，不展示单店明细（单店数据在业务分析里看）。
     所以「五店合计 / 五店访客」这类数字恒定，只有主店才有的指标挂「主店」作用域小标。
     切店只移动高亮，不再出现「一半数字变、一半不变」。 */

/* 分店微调：只做小幅抖动，**不再乘 ratio**。
   ratio 已经由 pushDemoStore 统一缩放过（SERVICE 在它的 walk 列表里）。
   老写法 demoNum 又乘了一次 (0.35 + ratio*0.9)，等于 ratio² 量级：
   实测分店 3 咨询量 216×0.14 = 30，被再乘成 10；分店 2 从 48 变 23。
   约定：比率 / 时长不随店铺规模变，只做小幅抖动；计数类严格按 ratio。 */
function jitter(store, base, salt, amp){
  if (store.real) return base;
  const n = seedOf(store.id + salt);
  return base * (1 + (n - 0.5) * amp);
}
/* 计数类按店取值的唯一入口：读 SERVICE_BASE（不可变基准），不读已被缩放的 SERVICE，
   这样「各店服务指标」表格与当前聚焦谁无关，切店不会让别的行跟着动。 */
const scaleSvc = (s, v) => s.real ? v : Math.round(v * s.ratio);

function pageService(st){
  const cur = storeOf(st.s);
  const rows = STORES.map(s => ({
    s,
    rate: Math.min(0.995, Math.max(0.60, jitter(s, SERVICE_BASE.threeMinRate, 'svc', 0.05))),
    sec:  Math.max(8, Math.round(jitter(s, SERVICE_BASE.firstRespSec, 'sec', 0.25))),
    cnt:  scaleSvc(s, SERVICE_BASE.consultCnt),
    wait: scaleSvc(s, SERVICE_BASE.rateUnreplied),
    wd:   scaleSvc(s, SERVICE_BASE.wendaPending)
  }));
  const me = rows.find(r => r.s.id === cur.id) || rows[0];

  const kpis = [
    kpiCard({label:'客服三分钟响应率', src:'demo', value:pct(me.rate,1), sub:me.rate >= 0.9 ? '达到平台线（90%）' : '低于平台线（90%），影响服务分'}),
    kpiCard({label:'旺旺人工平均响应时长', src:'demo', value:me.sec + '<small>s</small>', sub:'同行参考 40s 以内'}),
    kpiCard({label:'咨询数量', src:'demo', value:nf(me.cnt), sub:`30 天日均 ${(me.cnt / SAMPLE_DAYS).toFixed(1)} 个`}),
    kpiCard({label:'评价待商家回复', src:'demo', value:nf(me.wait) + '<small>条</small>', sub:me.wait > 0 ? '超过 48 小时会掉服务分' : '已清空'}),
    kpiCard({label:'问大家待答', src:'demo', value:nf(me.wd) + '<small>条</small>', sub:'影响商品详情页的信任度'}),
    kpiCard({label:'服务保障', src:'demo',
      value: cur.real ? SERVICE_BASE.protection : '未接入',

      <td>${r.wd || '<span class="mono-weak">0</span>'}</td>
    </tr>`).join('');

  return `
    <div class="page-head">
      <div>
        <h1 class="page-title">服务体验</h1>

          ${esc(storeOf(st.s).name)}${storeOf(st.s).real ? '' : '<span class="diag-badge" style="margin-left:6px">演示数据</span>'} · ${DATA_START} ～ ${DATA_END}

/* ══════════════════════════════════════════════════════════════════════════
   抽屉

const mask = document.getElementById('mask');
const drawer = document.getElementById('drawer');

function showDrawer(title, meta, body, actions){
  document.getElementById('dTitle').textContent = title;
  document.getElementById('dMeta').textContent = meta;
  document.getElementById('dBody').innerHTML = body;
  const ac = document.getElementById('dActions');
  if (actions && actions.length){
    ac.style.display = 'flex';
    ac.innerHTML = actions.map(a => `<button class="${a.primary?'btn-primary':'btn-ghost'}" ${a.go?`data-go="${a.go}"`:''} ${a.drawer?`data-drawer="${a.drawer}"`:''}>${a.label}</button>`).join('');
  } else {
    ac.style.display = 'none';
    ac.innerHTML = '';
  }
  mask.classList.add('on');
  drawer.classList.add('on');
  drawer.setAttribute('aria-hidden','false');
}

function closeDrawer(){
  mask.classList.remove('on');
  drawer.classList.remove('on');
  drawer.setAttribute('aria-hidden','true');
}

function openItem(id, st){
  /* 直接读 itemView，与列表、零成交卡完全同源。
     自己再算一遍缩放系数会让抽屉和表格对同一个链接报两个数。 */
  const { m: mItem, rows } = itemView(st.a[0], st.a[1]);
  const it  = rows.find(x => x.id === id);
  const raw = ITEMS.find(x => x.id === id);
  if (!it || !raw) return;
  const cur = storeOf(st.s);
  const full = mItem.full;
  const covDays = mItem.cov;
  const rangeLabel = (full ? '近 30 天整段' : `${st.a[0]} ～ ${st.a[1]} · 金额取区间真值、计数按真实访客占比缩放`)
    + (cur.real ? '' : ' · 演示值（该店未采集）');
  /* 占比用 30 天原值算，结构占比本身不随区间变 */
  const totalUv = ITEMS.reduce((s,x) => s + x.uv, 0);
  const totalAmt = ITEMS.reduce((s,x) => s + x.amt, 0);
  const uvShare = raw.uv / totalUv;
  const amtShare = totalAmt ? raw.amt / totalAmt : 0;
  const storeRate = mItem.rate;

  let verdict;
  if (it.amt === 0){
    verdict = `这个链接在这${full?' 30 天':` ${covDays} 天`}拿到 <b>${nf(it.uv)} 个访客</b>却一单没成。占着流量不出货，要么改主图、价格、详情，要么先下架把访客让给能转化的链接。`;
  } else if (it.rate < storeRate * 0.8 && uvShare > 0.3){
    verdict = `吃了 <b>${pct(uvShare,1)}</b> 的商品访客，转化率只有 <b>${pct(it.rate)}</b>，不到全店均值（${pct(storeRate)}）的八成。这是全店转化率被拖下来的主因。`;
  } else if (it.rate >= storeRate * 1.5){
    verdict = `转化率 <b>${pct(it.rate)}</b>，是全店均值的 <b>${(it.rate/storeRate).toFixed(1)} 倍</b>，却只拿到 ${pct(uvShare,1)} 的访客。值得加投，或从主推款直接导流过来。`;
  } else {
    verdict = `转化率 <b>${pct(it.rate)}</b>，接近或略高于全店均值，表现正常。`;
  }

  showDrawer(it.title, `商品 ID ${it.id} · ${rangeLabel}`, `
    <div class="dgrid">
      <div class="dcell"><span>商品访客</span><b>${nf(it.uv)}</b></div>
      <div class="dcell"><span>支付金额</span><b>${money(it.amt)}</b></div>
      <div class="dcell"><span>买家数</span><b>${it.byr}</b></div>
      <div class="dcell"><span>转化率</span><b>${it.rate?pct(it.rate):'0%'}</b></div>
      <div class="dcell"><span>加购金额</span><b>${money(it.cart)}</b></div>
      <div class="dcell"><span>收藏人数</span><b>${it.clt}</b></div>
    </div>

    <div class="cmp">
      <div class="cmp-head"><span>访客占全店</span><em>${pct(uvShare,1)}</em></div>
      <div class="cmp-row"><span>本商品</span>
        <div class="cmp-track"><u style="width:${(uvShare*100).toFixed(0)}%;background:var(--m-neutral)"></u></div>
      </div>
    </div>

    <div class="cmp">
      <div class="cmp-head"><span>支付金额占全店</span><em>${pct(amtShare,1)}</em></div>
      <div class="cmp-row"><span>本商品</span>
        <div class="cmp-track"><u style="width:${(amtShare*100).toFixed(0)}%;background:var(--m-blue)"></u></div>
      </div>
    </div>

    <div class="cmp">
      <div class="cmp-head"><span>转化率 vs 全店</span><em>${(it.rate/storeRate).toFixed(2)}× 全店均值</em></div>
      <div class="cmp-row"><span>本商品</span>
        <div class="cmp-track"><u style="width:${Math.min(100, it.rate/Math.max(it.rate,storeRate)*100).toFixed(0)}%;background:${it.rate>=storeRate?'var(--m-teal)':'var(--up)'}"></u></div>
      </div>
      <div class="cmp-row"><span>全店</span>
        <div class="cmp-track"><u style="width:${Math.min(100, storeRate/Math.max(it.rate,storeRate)*100).toFixed(0)}%;background:var(--muted-foreground)"></u></div>
      </div>
    </div>

    <div class="dnote">${verdict}</div>
  `, [
    {label:'看这条链接的流量来源', go:'#/flow?g=' + st.g + '&p=' + st.p + '&a1=' + st.a[0] + '&a2=' + st.a[1] + '&cmp=0&q=' + st.q},
    {label:'关闭', drawer:'close'}
  ]);
}

function openChannel(name, st){
  const c = CHANNELS.find(x => x.name === name);
  if (!c) return;
  /* 分店倍率已由 pushDemoStore 缩放进常量，这里直接用。
     区间折算必须跟页面一致，否则 7 天视图点进来会看到 30 天的数。 */
  const F = flowMetrics(st.a[0], st.a[1]);
  const C = c;
  const uv = Math.round(C.uv * F.uvRatio);
  const byr = Math.round(C.byr * F.uvRatio);
  showDrawer(C.name + ' 渠道',
    `${F.full ? '近 30 天整段' : `${st.a[0]} ～ ${st.a[1]}（${F.cov} 天）· ${F.basis === 'daily' ? '按真实访客占比推导' : `按 ${F.cov}/30 折算`}`} · 占全店访客 ${pct(C.ratio,1)}`, `
    <div class="dgrid">
      <div class="dcell"><span>访客数</span><b>${nf(uv)}</b></div>
      <div class="dcell"><span>支付买家</span><b>${byr}</b></div>
      <div class="dcell"><span>转化率</span><b>${C.rate?pct(C.rate):'0%'}</b></div>
      <div class="dcell"><span>环比</span><b class="${C.crc<0?'warn':''}">${F.full ? signed(C.crc) : '—'}</b></div>
    </div>
    <div class="cmp">
      <div class="cmp-head"><span>本店 vs 同行（30 天口径）</span><em>同行均 ${nf(C.avg)} · 同行优 ${nf(C.good)}</em></div>
      <div class="cmp-row"><span>本店</span>
        <div class="cmp-track"><u style="width:${(C.uv/C.good*100).toFixed(0)}%;background:var(--m-neutral)"></u></div></div>
      <div class="cmp-row"><span>同行均</span>
        <div class="cmp-track"><u style="width:${(C.avg/C.good*100).toFixed(0)}%;background:var(--muted-foreground)"></u></div></div>
      <div class="cmp-row"><span>同行优</span>
        <div class="cmp-track"><u style="width:100%;background:var(--m-teal)"></u></div></div>
    </div>
    <div class="dnote">
      ${C.name === '付费推广'
        ? `只有 <b>${nf(uv)} 个访客</b>，同行平均 ${nf(C.avg)}、优秀 ${nf(C.good)}，几乎等于没投。全店 ${pct(CHANNELS[0].ratio,1)} 的流量靠「经营优势」，这种结构抗风险能力很弱，一旦推荐权重波动，访客会瞬间归零。`
        : C.name === '主动回访'
        ? `访客少但转化率 <b>${pct(C.rate)}</b>，是经营优势的 4 倍多。老客主动触达是当前效率最高的通道，可惜只有 ${nf(uv)} 个访客。`
        : `转化率 <b>${C.rate?pct(C.rate):'0%'}</b>，略低于同行平均 ${nf(C.avg)} 的规模。这条渠道贡献了全店 ${pct(C.ratio,1)} 的访客，稳定但单点依赖。`}
      ${F.full ? '' : `<br />同行基准是 30 天口径的固定值，不随区间缩放，此处只作方向参考。`}
    </div>
  `, [
    {label:'看流量大盘', go:'#/flow?g=' + st.g + '&p=' + st.p + '&a1=' + st.a[0] + '&a2=' + st.a[1] + '&cmp=0&q=' + st.q, primary:true},
    {label:'关闭', drawer:'close'}
  ]);
}

    </div>
  `, [{label:'关闭', drawer:'close'}]);

function openBuyer(kind, st){
  const isNew = kind === 'new';
  const F = flowMetrics(st.a[0], st.a[1]);
  const nNew = Math.round(BUYERS.newCnt * F.uvRatio);
  const nOld = Math.round(BUYERS.oldCnt * F.uvRatio);
  const cnt = isNew ? nNew : nOld;
  const all = nNew + nOld;
  showDrawer(isNew ? '新买家' : '老买家',
    F.full ? '近 30 天 · 买家结构' : `${F.cov} 天折算 · 买家结构`, `
    <div class="dgrid">
      <div class="dcell"><span>买家数</span><b>${cnt}</b></div>
      <div class="dcell"><span>环比</span><b class="${isNew?'warn':''}">${F.full ? signed(isNew?BUYERS.newCrc:BUYERS.oldCrc) : '—'}</b></div>
      <div class="dcell"><span>占比</span><b>${pct(all ? cnt/all : 0,1)}</b></div>
      <div class="dcell"><span>总买家</span><b>${all}</b></div>
    </div>
    <div class="dnote">
      ${F.full
        ? (isNew
            ? `新客 ${cnt} 人、掉了 54.2%。同时商品收藏 −29.5%、店铺收藏 −46.7%。拉新通道基本停了，明年的复购池正在缩小。`
            : `老客 ${cnt} 人、涨了 200%，撑起了这个月 ${pct(all?cnt/all:0,1)} 的买家。这是好事，但结构太依赖老客复购，一旦老客消耗完就会断层。`)
        : `区间折算 ${cnt} 人，占 ${pct(all?cnt/all:0,1)}。新老结构按覆盖天数等比折算，与交易页支付买家 ${nf(metrics(st.a[0], st.a[1]).byr)} 人同源。`}

  `, [{label:'看流量来源', go:'#/flow?g=' + st.g + '&p=' + st.p + '&a1=' + st.a[0] + '&a2=' + st.a[1] + '&cmp=0&q=' + st.q}, {label:'关闭', drawer:'close'}]);
}
