# web 容器的站点配置：托管静态产物，并把 /api 反代到 api 容器。
#
# ## 为什么这里要反代，而不是让前端直连 api 的地址
#
# **为了保住「单一来源」这条前提。** 服务端从不发 CORS（见 api 侧与 8.5 的判断），
# 开发期靠 vite 的 proxy 把 /api 桥到 8787。若改成让前端直连 `http://api:8787`，
# 那就变成了跨源请求，于是要么加 CORS（浏览器里「同源」这条前提整个失效），
# 要么让前端接受一个可配置的 api 地址（多一处配置、且每个部署都要配）。
# 照抄 vite 代理的形状，前端 `API_BASE_URL` 保持空串，**一行不用改** ——
# 与 T4-01 外壳那段反代是同一个决定。
#
# ## upstream 为什么不能直接写死 IP
#
# 写成 `proxy_pass http://api:8787` 是对的 —— compose 网络里 DNS 会把服务名解析到
# 容器 IP，而容器每次重建 IP 可能变。**如果这里写死 IP，改一次就得改这里。**
# nginx 在启动时解析一次 upstream，因此容器 IP 变了要重启 nginx 才会生效；
# 但那只在 api 换 IP 且 nginx 没重启时发生，而 compose 会一起把它们重建。

upstream api_upstream {
    # 三个参数照抄 vite dev server 的代理配置，不多也不少。
    server api:8787;

    # 连接复用。**不加的话每个请求都要重新握手**，而这是本机回环或容器网络，
    # 握手成本比请求本身还高。
    keepalive 16;
}

server {
    # 监听容器内 80。端口映射由 compose 决定，不用在这里写 8080。
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传大小上限。默认 1MB 会让「导入数据」这类操作直接 413，而症状是
    # 「前端报了个错但看不出是大小问题」。
    #
    # 24m 跟着 `QUOTE_LIMITS.IMPORT_FILE_BYTES_MAX`（20MB）走，留 4m 给
    # multipart 边界、请求头与 HTTP 层。**这两个数必须一起改**：nginx 先收完
    # 整个请求体才转发，这里卡住时 api 的 bodyLimit 根本没机会说话，而 nginx 的
    # 413 是一张 HTML 页 —— 前端只能显示「服务返回了无法解析的响应」。
    client_max_body_size 24m;

    # 压缩。gzip 对 HTML 的效果比 br 差一些，但 nginx:alpine 自带的是 gzip，
    # 为此加 brotli 模块要多一个构建步骤 —— 收益不值那个复杂度。
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 哈希资源长缓存、index.html 不缓存。
    # 判定规则与外壳那个 `server.ts` 一样：**内容变了文件名会变**，
    # 因此带哈希的资源可以放心缓存一年，而入口页必须每次回源，否则用户拿到的是
    # 引用了旧哈希资源的新页面 —— 那个组合会 404。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 逐跳头必须清掉：它们描述的是**客户端与上一跳**之间的关系，
        # 转发给上游时会让上游看到错的 Host 与连接信息。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 读上游的超时。**默认 60 秒不够用，而且是「上传之后报超时」的直接来源之一。**
        #
        # 批量导入是一条「传 12MB + 服务端解析」的请求。nginx 的 60 秒从请求体收完
        # 之后开始算，api 那边只要慢一点就会撞上它，回一张 504 的 HTML 页 —— 界面上
        # 就成了一句与真实原因无关的「服务暂时不可用」。
        #
        # 300 秒与前端那条 XHR 的上限（`QUOTE_IMPORT_UPLOAD_TIMEOUT_MS`）一致：
        # 三层（浏览器 / nginx / api）里最外层必须比内层宽，否则报错总是来自中间的
        # 某一层，而那一层不知道业务上「多久才算慢」。
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        # 请求体是往上送的，方向相反；不设这条时默认也是 60 秒。
        proxy_send_timeout 300s;
    }

    # SPA 回退。**没有它，直接访问 `/notes` 这类深链会 404** —— 而那是 BrowserRouter
    # 的正常工作方式。规则是「这个路径不是真实文件就交给 index.html」。
    location / {
        try_files $uri $uri/ /index.html;
    }
}