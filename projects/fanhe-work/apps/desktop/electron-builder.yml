# Electron 外壳的打包配置（T6-03a）。
#
# 用法：`pnpm --filter @fanhe/desktop dist`（见 apps/desktop/package.json）。
# 取舍与踩点记在 `projects/fanhe-work/docs/T6-03-UPDATE-CHANNEL.md`，这里只留会改坏东西的那几条。
#
# 三处刻意偏离默认值，都是被本项目既有规则逼出来的：
#
#   1. `directories.output` 改成 `release/` —— electron-builder 的默认输出目录是
#      `dist`，而 `dist` 正是 tsc 的 outDir（main.js / preload.js 就躺在里面）。
#      两者叠在一起时，`files` 匹配 `dist/**` 可能把上一轮的安装包也读进去，一轮比一轮大。
#
#   2. `directories.buildResources` 挪到 `deploy/` —— 默认值是 `build/`，而
#      `projects/fanhe-work/.gitignore` 第 10 行已经把 `build/` 忽略了。放进去能打包成功、
#      但**永远进不了版本控制**，换台机器拉下来就没有图标，报错却是「找不到图标」。
#
#   3. 全部路径相对本文件所在目录（`apps/desktop/`），**不出现盘符或绝对路径** ——
#      工作区在可移动介质上，盘符在 `E:` / `F:` 之间变（阶段零就立下的规矩）。
#
# 产物名刻意用 ASCII：`fanhe-work-setup-<版本>.exe`。产品名是中文没有关系（那是装完之后
# 显示给人看的），但**资产名要经 GitHub Release 的 URL**，而 T6-03b 的更新器要从那里下载。
# 中文资产名会被百分号编码，是没必要引入的一处不确定性。

appId: org.fanhe.work
productName: 梵禾 Work
copyright: Copyright © 2026 梵禾

directories:
  output: release
  buildResources: deploy

# 刻意显式列出，不用默认的 `**/*`：包里真正需要的东西只有四类，
# 而默认会把 src/ 与 test/ 一并装进去。这里没有列进 `files` 的东西，
# **打包产物里就没有**，缺了会在启动时才炸 —— 所以这张表要跟着运行期依赖一起改。
files:
  - dist/**
  - package.json
  # 外壳是 CJS 而 @fanhe/shared 是纯 ESM，壳在运行时要 require 它（Electron 的
  # Node 24 支持 require(esm)）。pnpm 下它是指向 packages/shared 的符号链接，
  # 显式列出比指望打包器自己解引用可靠。
  - node_modules/@fanhe/shared/dist/**

# 装完之后的目录形态（安装目录/resources 下）：
#
#   web/            前端构建产物。开发态它在 apps/web/dist，是 __dirname 的兄弟；
#                   打包后 asar 内没有兄弟目录，所以走 resources（见 src/paths.ts）。
#   agent/agent.ts  本机代理核心。**原样投递 TS 源码，不编译** —— 那份文件运行时
#                   依赖为零（只有 node 内建 + 一条会被抹掉的 import type），
#                   而外壳的开发态本来就是直接吃 api 的源码。
#   agent/package.json  内容是 {"type":"module"}。**这一份不能省**：`.ts` 的模块类型
#                   由最近的 package.json 决定，缺失只告警、写成 commonjs 则直接
#                   SyntaxError 整条链路失效（实测见 docs/T6-03-UPDATE-CHANNEL.md §3.5）。
extraResources:
  - from: ../web/dist
    to: web
  - from: ../api/src/launch/agent.ts
    to: agent/agent.ts
  - from: deploy/agent
    to: agent

win:
  target:
    - target: nsis
      arch:
        - x64
  # 图标源是 web 的品牌 logo（apps/web/public/brand/logo.png，362×391）。
  # 它不是方形、也没有透明通道，所以任务栏与开始菜单里会带底色 —— 记为已知限制，
  # 换成一枚方形带 alpha 的 .ico 即可，本文件改一行，别的都不用动。
  icon: ../web/public/brand/logo.png

  # ── 代码签名（T6-03c）────────────────────────────────────────────────
  # 🔴 **签名相关的键必须写在 `signtoolOptions` 里面**，不能平铺在 `win` 下。
  # electron-builder 26.x 把这一组选项整体挪进了 `WindowsSigntoolConfiguration`
  # 子对象，而 `win` 本身是 `additionalProperties: false` —— 平铺会得到一个
  # 完全不说人话的报错：`configuration.win should be one of these: null`（不点名
  # 是哪个键错了，只让你去翻文档）。实测依据：`app-builder-lib/scheme.json` 的
  # `WindowsConfiguration` 32 个属性里没有 `certificateSubjectName`，而
  # `WindowsSigntoolConfiguration` 里有；运行期读的也是
  # `platformSpecificBuildOptions.signtoolOptions?.certificateSubjectName`。
  # 注意 `out/options/winOptions.d.ts` 里 `certificateSubjectName` 确实存在，
  # 但它属于第 73 行起的 `WindowsSigntoolConfiguration` 接口 —— 只看「文件里有没有
  # 这个词」会得出相反结论，要看它在哪个 interface 里。
  signtoolOptions:
    # 证书不进版本控制、工作区内不落 `.pfx`：身份就是 `CurrentUser\My` 里那张自签
    # 证书（Windows 证书库受 DPAPI 与登录态保护，且**随机器不随盘**，正好满足
    # DEVELOPMENT-PLAN.md 6.3 第 6 条「签名密钥与工作空间分开保管」）。
    # 新建/复用证书：`pnpm --filter @fanhe/desktop signing:cert`。
    #
    # 用证书库而不是 `certificateFile` + 口令，是因为后者要把 `.pfx` 与口令送进构建
    # 进程（口令经环境变量传、`.pfx` 落盘），多两处会泄漏的东西。
    #
    # 主题名刻意用 ASCII：它会穿过 PowerShell → 证书库 → signtool → `app-update.yml`
    # → electron-updater 的字符串比对，其中任何一步编码有损都会静默破坏更新校验。
    # 与产物名用 ASCII 是同一条理由。证书的 display name 对用户不可见。
    #
    # 🔴 **两种机器要做的事不一样，混了会静默破坏更新**：
    #   · 打包机（有私钥）：跑 `signing:cert` —— 新建/复用证书，并把公开部分加进
    #     本机 `CurrentUser\Root` 与 `TrustedPublisher`。
    #   · 目标机（只有公钥，用来接收更新）：跑 `signing:trust` —— **只装信任根、
    #     不建证书**。在这台机器上跑 `signing:cert` 会造出一张新证书，而已发布的包
    #     是原来那张签的，于是这台机器永远收不到更新。它只需要
    #     `scripts/fanhe-work-signing-public.cer`（**已入版本控制**，私钥不需要）。
    #   · 查目标机装没装好：`signing:trust-check`（只读，退出码 0 = 能收更新）。
    #
    # 🔴 换证书之所以致命，**不是**因为签名主体变了 —— `publisherName` 由证书的
    # Subject DN 推出来，同 CN 就同字符串，换一张同 CN 的证书不会让它变样。真正
    # 断掉的是**信任根**：自签根逐机导入，已装机器上没有新根 → `Status` 不再是
    # `Valid` → 发布者比对被整段跳过 → 更新被拒（不报错，只静默失败）。
    #
    # 🔴 打包机那一步（以及目标机的 `signing:trust`）都要把公开部分加进
    # `CurrentUser\Root`（受信任根）。
    # **只加 `TrustedPublisher` 是不够的**，这是 T6-03b 实测出来的一个静默洞：
    # 仅进 `TrustedPublisher` 时 `Get-AuthenticodeSignature` 返回
    # `Status=UnknownError`（"证书链在不受信任的根中终止"），文件看起来签好了，
    # 而 electron-updater 的 Windows 校验只在 `data.Status === 0`（`Valid`）时才
    # 进入发布者名比对 —— 非 0 就整段跳过、**每次更新都被拒**。
    # 补进 `Root` 后：`STATUS=Valid VALUE=0`。
    # 添加用 `certutil -user -addstore -f Root`：`Import-Certificate` 在无 UI 会话里
    # 会以「此操作中不允许使用 UI」失败（它要弹根证书确认框）。
    #
    # 只按主题名匹配是可行的：electron-builder 用
    # `Get-ChildItem -Recurse Cert: -CodeSigningCert` 取候选、拿第一个命中的。
    # 实测本机该命令只返回一条（`CurrentUser\My`，有私钥）；`TrustedPublisher` 里
    # 那份公开副本没有被它枚举到，所以不会选中「没有私钥的那一份」而签名失败。
    certificateSubjectName: CN=Fanhe Work
    signingHashAlgorithms:
      - sha256
    # 时间戳**没有**在这里配，走 electron-builder 的默认值
    # `http://timestamp.digicert.com`（实测可达）。有可信时间戳，签名在证书过期后
    # 仍然有效；若哪天网络不通导致打包失败，用 `ELECTRON_BUILDER_OFFLINE=true`
    # 可以整体跳过时间戳（代价是签名只在证书有效期内有效）。

nsis:
  # 不做一键装：这台机器没有管理员权限（perMachine 必须为 false，
  # 否则要 UAC 提权），而允许改安装目录对内部工具更实用。
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 梵禾 Work
  artifactName: fanhe-work-setup-${version}.${ext}

# 发布载体已定为 GitHub（公开仓库，见 docs/T6-03-UPDATE-CHANNEL.md §四）。
# T6-03a 只打包不发布，靠命令行传 `--publish never` 兜住；这一段现在就写在这里，
# 是因为**只有配了 publish，electron-builder 才会产出 latest.yml 与 blockmap** ——
# 而「发布链路是通的」这件事在这一步就该被验到。
publish:
  provider: github
  owner: dy00001
  repo: fanhe-work
